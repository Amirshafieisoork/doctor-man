<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — پنل مدیریت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}header{position:sticky;top:0;z-index:10;padding:14px 24px;background:rgba(5,13,26,.93);border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}header b{color:var(--a);font-size:20px}.wrap{max-width:1300px;margin:auto;padding:24px}.login{max-width:440px;margin:80px auto;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:28px}.login input{width:100%;padding:12px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);font:inherit;margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 14px;background:linear-gradient(135deg,var(--a),#0066ff);color:#fff;font:700 12px Vazirmatn;cursor:pointer}.btn.red{background:rgba(255,68,102,.12);color:var(--r);border:1px solid rgba(255,68,102,.2)}.btn.green{background:rgba(0,255,157,.1);color:var(--g);border:1px solid rgba(0,255,157,.2)}.dash{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:var(--s);border:1px solid var(--b);color:var(--d);padding:9px 13px;border-radius:9px;font:12px Vazirmatn;cursor:pointer}.tabs button.active{color:var(--a);border-color:var(--a)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px}.stat b{font-size:22px;display:block}.stat small{color:var(--d)}.section{display:none}.section.active{display:block}.card{background:var(--s);border:1px solid var(--b);border-radius:16px;overflow:auto}.card h3{padding:16px;margin:0;border-bottom:1px solid var(--b)}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px 13px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}th{color:var(--d);background:var(--s2)}select{background:var(--s2);border:1px solid var(--b);color:var(--t);padding:7px;border-radius:8px;font:11px Vazirmatn}.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--s2)}.paid{color:var(--g)}.failed{color:var(--r)}.pending{color:var(--y)}.support{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04)}.support small{color:var(--d)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}</style></head><body><header><b>🩺 DrMan Admin</b><a href="/" style="color:#7aa0c4;text-decoration:none">مشاهده سایت</a></header><div class="wrap"><section class="login" id="login"><h2>ورود مدیر</h2><p style="color:#7aa0c4;font-size:12px">رمز مدیریت را وارد کنید.</p><input id="pass" type="password" placeholder="رمز مدیریت"><button class="btn" onclick="login()">ورود</button><div id="loginErr" style="color:#ff8da0;font-size:12px;margin-top:10px"></div></section><section class="dash" id="dash"><div class="stats" id="stats"></div><div class="tabs"><button class="active" onclick="tab('users',this)">کاربران</button><button onclick="tab('tests',this)">آزمایش‌ها</button><button onclick="tab('payments',this)">پرداخت‌ها</button><button onclick="tab('plans',this)">پلن‌ها</button><button onclick="tab('support',this)">پشتیبانی</button><button onclick="logoutAdmin()">خروج</button></div><section id="users" class="section active"><div class="card"><h3>کاربران</h3><table><thead><tr><th>کاربر</th><th>شماره</th><th>پلن</th><th>اعتبار</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="usersBody"></tbody></table></div></section><section id="tests" class="section"><div class="card"><h3>آزمایش‌ها</h3><table><thead><tr><th>تاریخ</th><th>علت</th><th>سن/جنسیت</th><th>وضعیت</th><th>کاربر</th></tr></thead><tbody id="testsBody"></tbody></table></div></section><section id="payments" class="section"><div class="card"><h3>پرداخت‌ها</h3><table><thead><tr><th>تاریخ</th><th>کاربر</th><th>پلن</th><th>مبلغ</th><th>وضعیت</th><th>کد پیگیری</th></tr></thead><tbody id="paymentsBody"></tbody></table></div></section><section id="plans" class="section"><div class="card"><h3>پلن‌ها</h3><table><thead><tr><th>نام</th><th>قیمت</th><th>سهمیه</th><th>محبوب</th><th>فعال</th></tr></thead><tbody id="plansBody"></tbody></table></div></section><section id="support" class="section"><div class="card"><h3>آخرین پیام‌های پشتیبانی</h3><div id="supportBody"></div></div></section></section></div><script>let D=null;function fa(n){return Number(n||0).toLocaleString('fa-IR')}function date(v){return v?new Date(v).toLocaleString('fa-IR'):'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok){document.getElementById('loginErr').textContent=d.error||'ورود ناموفق';return}sessionStorage.setItem('adminToken','active');load()}function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}async function load(){const r=await fetch('/api/admin-dashboard');if(r.status===401){document.getElementById('login').style.display='block';document.getElementById('dash').style.display='none';return}D=await r.json();if(!D.success)return;document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';render()}function render(){const s=D.stats;document.getElementById('stats').innerHTML=[['کاربران',s.users],['فعال',s.active_users],['آزمایش‌ها',s.tests],['هشدار جدی',s.danger_tests],['پرداخت موفق',s.paid_payments],['درآمد',fa(s.revenue)+' تومان']].map(x=>`<div class="stat"><b>${typeof x[1]==='number'?fa(x[1]):x[1]}</b><small>${x[0]}</small></div>`).join('');document.getElementById('usersBody').innerHTML=D.users.map(u=>`<tr><td>${esc(u.name||'—')}</td><td>${esc(u.phone)}</td><td><select onchange="setPlan('${u.id}',this.value)">${D.plans.map(p=>`<option value="${p.id}" ${u.plan_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td>${date(u.plan_expires_at)}</td><td><span class="badge ${u.status==='active'?'paid':'failed'}">${esc(u.status)}</span></td><td><button class="btn ${u.status==='active'?'red':'green'}" onclick="userStatus('${u.id}','${u.status==='active'?'block-user':'unblock-user'}')">${u.status==='active'?'مسدود':'فعال'}</button></td></tr>`).join('');document.getElementById('testsBody').innerHTML=D.tests.map(t=>`<tr><td>${date(t.created_at)}</td><td>${esc(t.reason||'—')}</td><td>${esc(t.gender||'—')} / ${esc(t.age||'—')}</td><td>${esc(t.status||'normal')}</td><td>${esc(t.user_id||'—')}</td></tr>`).join('');document.getElementById('paymentsBody').innerHTML=D.payments.map(p=>`<tr><td>${date(p.created_at)}</td><td>${esc(p.users?.name||p.users?.phone||'—')}</td><td>${esc(p.plans?.name||'—')}</td><td>${fa(p.amount)} تومان</td><td><span class="badge ${esc(p.status)}">${esc(p.status)}</span></td><td>${esc(p.tracking_code||'—')}</td></tr>`).join('');document.getElementById('plansBody').innerHTML=D.plans.map(p=>`<tr><td>${esc(p.name)}</td><td>${fa(p.price)}</td><td>${fa(p.test_limit)}</td><td>${p.is_popular?'✓':'—'}</td><td>${p.active?'✓':'—'}</td></tr>`).join('');document.getElementById('supportBody').innerHTML=D.support.map(m=>`<div class="support"><b>${m.role==='user'?'کاربر':'AI'} — ${esc(m.users?.name||m.users?.phone||'')}</b><br><small>${date(m.created_at)}</small><div>${esc(m.content)}</div></div>`).join('')||'<div class="support">پیامی وجود ندارد.</div>'}async function action(body){const r=await fetch('/api/admin-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)alert(d.error||'خطا');else load()}function userStatus(id,a){action({id,action:a})}function setPlan(id,plan_id){action({id,action:'set-plan',plan_id})}function logoutAdmin(){sessionStorage.removeItem('adminToken');location.reload()}if(sessionStorage.getItem('adminToken'))load();</script></body></html>
