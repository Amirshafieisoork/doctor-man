<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پزشکان | DrMan</title><meta name="description" content="جستجو و انتخاب پزشکان تأییدشده بر اساس تخصص و شهر، مشاهده پروفایل و درخواست نوبت در DrMan."><link rel="canonical" href="https://drman.vercel.app/doctors"><link rel="manifest" href="/manifest.webmanifest"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--surface:#0a1628;--surface2:#0f1e36;--accent:#00d4ff;--green:#00ff9d;--text:#e8f4ff;--dim:#7aa0c4;--border:rgba(0,212,255,.15)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:20;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,13,26,.93);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}.logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;color:transparent}.btn,button,input,select{font-family:inherit}.btn,button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:10px 14px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),#086cff);border:0}.wrap{max-width:1180px;margin:auto;padding:42px 18px 70px}.hero{text-align:center;margin-bottom:30px}.hero h1{font-size:38px;margin:0 0 10px}.muted{color:var(--dim)}.search{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:24px}input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.doc{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}.doc:hover{border-color:rgba(0,212,255,.4);transform:translateY(-2px)}.avatar{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,255,157,.18));display:flex;align-items:center;justify-content:center;font-size:26px}.doc h2{font-size:18px;margin:0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(0,212,255,.08);color:var(--accent)}.footer{display:flex;gap:8px;margin-top:auto}.footer>*{flex:1;text-align:center}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--dim);background:var(--surface);border:1px dashed var(--border);border-radius:18px}.doctorJoin{margin-top:40px;background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(0,255,157,.06));border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.search{grid-template-columns:1fr 1fr}.search input{grid-column:1/-1}}@media(max-width:600px){.grid,.search{grid-template-columns:1fr}.search input{grid-column:auto}.doctorJoin{flex-direction:column;align-items:flex-start}}</style></head><body><header><a class="logo" href="/">DrMan</a><div><a class="btn" href="/health">پرونده سلامت</a> <a class="btn" href="/doctor-onboarding">ورود پزشکان</a></div></header><main class="wrap"><section class="hero"><h1>پزشک مناسب را پیدا کن</h1><p class="muted">پزشکان تأییدشده، دسترسی رضایت‌محور به پرونده سلامت و امکان درخواست نوبت.</p></section><section class="search"><input id="q" placeholder="نام پزشک یا تخصص"><input id="specialty" placeholder="تخصص"><input id="city" placeholder="شهر"><button class="primary" onclick="load()">جستجو</button></section><section class="grid" id="grid"><div class="empty">در حال دریافت پزشکان...</div></section><section class="doctorJoin"><div><h2>پزشک هستید؟</h2><p class="muted">پروفایل حرفه‌ای، مدیریت بیمار، نوبت‌ها و پرونده‌های اشتراکی را در DrMan مدیریت کنید.</p></div><a class="btn primary" href="/doctor-onboarding">ساخت پروفایل پزشک</a></section></main><script>const $=i=>document.getElementById(i);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const p=new URLSearchParams();if($('q').value)p.set('q',$('q').value);if($('specialty').value)p.set('specialty',$('specialty').value);if($('city').value)p.set('city',$('city').value);try{const r=await fetch('/api/doctors?'+p);const d=await r.json();const docs=d.doctors||[];$('grid').innerHTML=docs.length?docs.map(x=>`<article class="doc"><div class="avatar">🩺</div><h2>${esc(x.full_name)}</h2><div class="muted">${esc(x.specialty)}${x.sub_specialty?' · '+esc(x.sub_specialty):''}</div><div class="tags">${x.city?`<span class="tag">${esc(x.city)}</span>`:''}${x.accepts_online?'<span class="tag">مشاوره آنلاین</span>':''}${x.accepts_in_person?'<span class="tag">حضوری</span>':''}</div><p class="muted">${esc((x.bio||'').slice(0,160))}</p><div class="footer"><a class="btn" href="/doctor/${encodeURIComponent(x.slug)}">پروفایل</a><a class="btn primary" href="/doctor/${encodeURIComponent(x.slug)}#appointment">درخواست نوبت</a></div></article>`).join(''):'<div class="empty">فعلاً پزشکی با این فیلتر پیدا نشد.</div>'}catch(e){$('grid').innerHTML='<div class="empty">خطا در دریافت پزشکان</div>'}}load();</script></body></html>
