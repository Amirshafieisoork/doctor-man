<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — پرونده سلامت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:55px 55px;pointer-events:none}header{position:sticky;top:0;z-index:10;background:rgba(5,13,26,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--b);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}.brand{color:var(--a);font-weight:900;text-decoration:none;font-size:20px}.actions{display:flex;gap:8px}.actions a,.actions button{background:var(--s);color:var(--d);border:1px solid var(--b);padding:8px 11px;border-radius:9px;text-decoration:none;font:12px Vazirmatn;cursor:pointer}.layout{max-width:1180px;margin:auto;padding:30px 20px;display:grid;grid-template-columns:290px 1fr;gap:20px}.side,.panel{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:22px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#7c3aed);font-size:30px;margin:0 auto 12px}.center{text-align:center}.muted{color:var(--d);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.stat{background:var(--s2);padding:12px;border-radius:12px;text-align:center}.stat b{display:block;color:var(--a);font-size:20px}.plan{margin-top:16px;padding:14px;background:var(--s2);border-radius:12px}.plan a{color:var(--y);text-decoration:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.sum{background:var(--s);border:1px solid var(--b);padding:18px;border-radius:15px}.sum b{font-size:24px}.records{display:flex;flex-direction:column;gap:12px}.record{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px}.record.danger{border-color:rgba(255,68,102,.35)}.record.warning{border-color:rgba(255,208,96,.35)}.top{display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--s2)}.status.normal{color:var(--g)}.status.warning{color:var(--y)}.status.danger{color:var(--r)}.analysis{display:none;white-space:pre-wrap;line-height:2;color:#cbddec;font-size:13px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.05)}.analysis.open{display:block}.toggle{margin-top:10px;color:var(--a);font-size:12px;cursor:pointer}.empty{padding:40px;text-align:center;color:var(--d)}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.side{order:1}.panel{order:2}}</style></head><body><header><a class="brand" href="/">🩺 DrMan</a><div class="actions"><a href="/pricing.html">ارتقای پلن</a><a href="/support.html">پشتیبانی</a><button onclick="logout()">خروج</button></div></header><main class="layout"><aside class="side"><div class="center"><div class="avatar">👤</div><h3 id="name">...</h3><div class="muted" id="phone">...</div></div><div class="stats"><div class="stat"><b id="total">۰</b><span class="muted">کل آزمایش‌ها</span></div><div class="stat"><b id="remaining">۰</b><span class="muted">باقی‌مانده ماه</span></div></div><div class="plan"><div class="muted">پلن فعلی</div><b id="plan">...</b><div class="muted" id="expire"></div><a href="/pricing.html">مدیریت اشتراک ←</a></div></aside><section><div class="summary"><div class="sum"><span class="muted">نتایج نرمال</span><br><b id="normal">۰</b></div><div class="sum"><span class="muted">نیاز به توجه</span><br><b id="warning">۰</b></div><div class="sum"><span class="muted">پرداخت موفق</span><br><b id="paid">۰</b></div></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>تاریخچه آزمایش‌ها</h3><a href="/" style="color:var(--a);text-decoration:none">+ آزمایش جدید</a></div><div id="records" class="records"><div class="empty">در حال بارگذاری…</div></div></div></section></main><script>let data=null;function fa(n){return Number(n||0).toLocaleString('fa-IR')}function date(v){return v?new Date(v).toLocaleDateString('fa-IR'):'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch('/api/account');if(r.status===401){location.href='/auth.html';return}data=await r.json();if(!data.success){document.getElementById('records').innerHTML='<div class="empty">بارگذاری اطلاعات انجام نشد.</div>';return}document.getElementById('name').textContent=data.user.name||'کاربر DrMan';document.getElementById('phone').textContent=data.user.phone;document.getElementById('plan').textContent=data.subscription.plan?.name||'رایگان';document.getElementById('expire').textContent='اعتبار تا '+date(data.subscription.expires_at);document.getElementById('remaining').textContent=data.subscription.remaining==null?'∞':fa(data.subscription.remaining);document.getElementById('total').textContent=fa(data.tests.length);const normal=data.tests.filter(x=>x.status==='normal').length;const warn=data.tests.length-normal;document.getElementById('normal').textContent=fa(normal);document.getElementById('warning').textContent=fa(warn);document.getElementById('paid').textContent=fa(data.payments.filter(x=>x.status==='paid').length);render()}function render(){const c=document.getElementById('records');if(!data.tests.length){c.innerHTML='<div class="empty">هنوز آزمایشی ثبت نشده است.<br><a href="/" style="color:#00d4ff">اولین آزمایش را تحلیل کن</a></div>';return}c.innerHTML=data.tests.map((t,i)=>`<article class="record ${esc(t.status||'normal')}"><div class="top"><div><b>${esc(t.reason||'آزمایش عمومی')}</b><div class="muted">${esc(t.gender||'—')}، ${esc(t.age||'—')} سال • ${date(t.created_at)}</div></div><span class="status ${esc(t.status||'normal')}">${t.status==='danger'?'⛔ غیرنرمال':t.status==='warning'?'⚠ نیاز به توجه':'✓ نرمال'}</span></div><div class="analysis" id="a${i}">${esc(t.analysis||'بدون توضیح')}</div><div class="toggle" onclick="toggle(${i})">نمایش / بستن جزئیات</div></article>`).join('')}function toggle(i){document.getElementById('a'+i).classList.toggle('open')}async function logout(){await fetch('/api/logout',{method:'POST'});localStorage.removeItem('user');location.href='/'}load().catch(()=>document.getElementById('records').innerHTML='<div class="empty">خطا در ارتباط با سرور</div>');</script></body></html>
