<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری | دکتر من</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="مدیریت حساب، اشتراک، تاریخچه تحلیل‌ها و تنظیمات داده در دکتر من."><link rel="icon" type="image/png" href="/assets/drman-logo.svg"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:55px 55px;pointer-events:none}header{position:sticky;top:0;z-index:10;background:rgba(5,13,26,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--b);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}.brand{color:var(--a);font-weight:900;text-decoration:none;font-size:20px;display:flex;align-items:center;gap:8px}.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}.actions{display:flex;gap:8px}.actions a,.actions button{background:var(--s);color:var(--d);border:1px solid var(--b);padding:8px 11px;border-radius:9px;text-decoration:none;font:12px Vazirmatn;cursor:pointer}.layout{max-width:1180px;margin:auto;padding:30px 20px;display:grid;grid-template-columns:290px 1fr;gap:20px}.side,.panel{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:22px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#7c3aed);font-size:30px;margin:0 auto 12px}.center{text-align:center}.muted{color:var(--d);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.stat{background:var(--s2);padding:12px;border-radius:12px;text-align:center}.stat b{display:block;color:var(--a);font-size:20px}.plan{margin-top:16px;padding:14px;background:var(--s2);border-radius:12px}.plan a{color:var(--y);text-decoration:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.sum{background:var(--s);border:1px solid var(--b);padding:18px;border-radius:15px}.sum b{font-size:24px}.records{display:flex;flex-direction:column;gap:12px}.record{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px}.record.danger{border-color:rgba(255,68,102,.35)}.record.warning{border-color:rgba(255,208,96,.35)}.top{display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--s2)}.status.normal{color:var(--g)}.status.warning{color:var(--y)}.status.danger{color:var(--r)}.analysis{display:none;white-space:pre-wrap;line-height:2;color:#cbddec;font-size:13px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.05)}.analysis.open{display:block}.toggle{border:0;background:transparent;font-family:inherit;padding:0;text-align:right;margin-top:10px;color:var(--a);font-size:12px;cursor:pointer}.empty{padding:40px;text-align:center;color:var(--d)}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.side{order:1}.panel{order:2}}</style><link rel="stylesheet" href="/assets/theme-v1.css"><link rel="stylesheet" href="/assets/product.css"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/site-style.css"></head><body><header><a class="brand" href="/"><img src="/assets/drman-logo.svg" alt="لوگوی دکتر من">DrMan</a><div class="actions"><a href="/health">پرونده سلامت</a><a href="/pricing">پلن‌ها</a><a href="/support">راهنمای هوشمند</a><button id="logoutButton" type="button" onclick="logout()">خروج</button></div></header><main class="layout"><aside class="side"><div class="center"><div class="avatar">👤</div><h3 id="name">...</h3><div class="muted" id="phone">...</div></div><div class="stats"><div class="stat"><b id="total">—</b><span class="muted">آزمایش‌های اخیر</span></div><div class="stat"><b id="remaining">—</b><span class="muted">باقی‌مانده ماه</span></div></div><div class="plan"><div class="muted">پلن فعلی</div><b id="plan">...</b><div class="muted" id="expire"></div><a href="/pricing">مدیریت اشتراک ←</a></div><div class="plan"><div class="muted">داده و حریم خصوصی</div><button id="exportButton" type="button" style="margin-top:8px;width:100%" onclick="exportData()">دریافت نسخه اطلاعات من</button><button id="deleteButton" type="button" style="margin-top:8px;width:100%;color:var(--r)" onclick="requestDeletion()">درخواست حذف حساب</button><button id="cancelDeleteButton" type="button" style="margin-top:8px;width:100%" onclick="cancelDeletion()" hidden>لغو درخواست حذف</button><div id="deleteState" role="status" aria-live="polite" class="muted" style="margin-top:6px"></div><div style="margin-top:8px"><a href="/privacy">حریم خصوصی</a> · <a href="/terms">شرایط استفاده</a></div></div></aside><section><div class="summary"><div class="sum"><span class="muted">نتایج نرمال</span><br><b id="normal">—</b></div><div class="sum"><span class="muted">نیاز به توجه</span><br><b id="warning">—</b></div><div class="sum"><span class="muted">پرداخت موفق</span><br><b id="paid">—</b></div></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3>آزمایش‌های اخیر</h3><a href="/" style="color:var(--a);text-decoration:none">+ آزمایش جدید</a></div><div id="records" class="records" aria-live="polite" aria-busy="true"><div class="empty">در حال بارگذاری…</div></div></div></section></main><script>
let data = null, deletion = null, deleteBusy = false, exportBusy = false, logoutBusy = false;
const $ = id => document.getElementById(id);
const fa = value => Number(value || 0).toLocaleString('fa-IR');
function date(value) { const d = new Date(value); return value && !Number.isNaN(d.getTime()) ? d.toLocaleDateString('fa-IR') : '—'; }
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loginRedirect() { location.assign('/auth?next=' + encodeURIComponent(location.pathname + location.search)); }
async function request(url, options = {}) {
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 20000);
  try {
    const response = await fetch(url, {...options, credentials: 'include', signal: controller.signal});
    if (response.status === 401) { loginRedirect(); throw new Error('برای ادامه دوباره وارد حساب شوید.'); }
    const result = await response.json().catch(() => null);
    if (!response.ok || !result || (url !== '/api/account-export' && result.success !== true)) throw new Error(result?.error || 'دریافت اطلاعات انجام نشد. دوباره تلاش کنید.');
    return result;
  } catch (error) { if (error.name === 'AbortError') throw new Error('پاسخ سرور طول کشید. دوباره تلاش کنید.'); if (error instanceof TypeError) throw new Error('ارتباط با سرور برقرار نشد. دوباره تلاش کنید.'); throw error; }
  finally { clearTimeout(timer); }
}
async function load() {
  $('records').setAttribute('aria-busy', 'true');
  try {
    const result = await request('/api/account');
    if (result.success !== true || !result.user || !result.subscription || !Array.isArray(result.tests) || !Array.isArray(result.payments)) throw new Error('اطلاعات حساب کامل دریافت نشد. دوباره تلاش کنید.');
    data = result;
    $('name').textContent = data.user.name || 'کاربر دکتر من';
    $('phone').textContent = data.user.phone || '—';
    $('plan').textContent = data.subscription.plan?.name || 'رایگان';
    $('expire').textContent = data.subscription.expires_at ? 'اعتبار تا ' + date(data.subscription.expires_at) : 'بدون تاریخ پایان ثبت‌شده';
    $('remaining').textContent = data.subscription.remaining == null ? 'نامحدود' : fa(data.subscription.remaining);
    $('total').textContent = fa(data.tests.length);
    $('normal').textContent = fa(data.tests.filter(test => test.status === 'normal').length);
    $('warning').textContent = fa(data.tests.filter(test => ['warning', 'danger'].includes(test.status)).length);
    $('paid').textContent = fa(data.payments.filter(payment => payment.status === 'paid').length);
    render();
    await loadDeletion();
  } catch (error) {
    $('records').innerHTML = '<div class="empty">' + esc(error.message || 'ارتباط با سرور برقرار نشد.') + '<br><button type="button" onclick="load()">تلاش دوباره</button></div>';
    $('name').textContent = 'اطلاعات حساب دریافت نشد'; $('phone').textContent = '—'; $('plan').textContent = '—';
  } finally { $('records').setAttribute('aria-busy', 'false'); }
}
function render() {
  if (!data.tests.length) {
    $('records').innerHTML = '<div class="empty">هنوز آزمایشی ثبت نشده است.<br><a href="/" style="color:var(--a)">اولین آزمایش را تحلیل کنید</a></div>'; return;
  }
  $('records').innerHTML = data.tests.map((test, index) => {
    const status = ['normal','warning','danger'].includes(test.status) ? test.status : '';
    const label = status === 'danger' ? '⛔ غیرنرمال' : status === 'warning' ? '⚠ نیاز به توجه' : status === 'normal' ? '✓ نرمال' : 'بررسی نشده';
    return `<article class="record ${status}"><div class="top"><div><b>${esc(test.reason || 'آزمایش عمومی')}</b><div class="muted">${esc(test.gender || '—')}، ${esc(test.age ?? '—')} سال • ${date(test.created_at)}</div></div><span class="status ${status}">${label}</span></div><div class="analysis" id="a${index}">${esc(test.analysis || 'بدون توضیح')}</div><button type="button" class="toggle" aria-controls="a${index}" aria-expanded="false" onclick="toggle(${index},this)">نمایش جزئیات</button></article>`;
  }).join('');
}
function toggle(index, button) {
  const open = $('a' + index).classList.toggle('open');
  button.setAttribute('aria-expanded', String(open)); button.textContent = open ? 'بستن جزئیات' : 'نمایش جزئیات';
}
async function exportData() {
  if (exportBusy) return; exportBusy = true; $('exportButton').disabled = true;
  $('deleteState').textContent = 'در حال آماده‌سازی نسخه اطلاعات…';
  try {
    const result = await request('/api/account-export');
    if (!result.exported_at || !result.account || !result.data) throw new Error('نسخه اطلاعات کامل دریافت نشد.');
    const url = URL.createObjectURL(new Blob([JSON.stringify(result, null, 2)], {type: 'application/json;charset=utf-8'}));
    const link = document.createElement('a'); link.href = url; link.download = 'drman-health-export-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    $('deleteState').textContent = 'نسخه اطلاعات برای دریافت آماده شد.';
  } catch (error) { $('deleteState').textContent = error.message || 'دریافت نسخه اطلاعات انجام نشد.'; }
  finally { exportBusy = false; $('exportButton').disabled = false; }
}
function renderDeletion() {
  const labels = {requested: 'درخواست حذف ثبت شده و تا شروع پردازش قابل لغو است.', processing: 'درخواست حذف در حال پردازش است.', cancelled: 'درخواست حذف لغو شده است.', completed: 'درخواست حذف پردازش شده است.'};
  $('deleteState').textContent = labels[deletion?.status] || 'درخواست حذفی ثبت نشده است.';
  $('deleteButton').disabled = ['requested','processing'].includes(deletion?.status);
  $('cancelDeleteButton').hidden = deletion?.status !== 'requested';
}
async function requestDeletion() {
  if (deleteBusy || !confirm('درخواست حذف حساب ثبت شود؟ حساب فوراً حذف نمی‌شود و درخواست تا شروع پردازش قابل لغو است.')) return;
  await changeDeletion('POST');
}
async function cancelDeletion() { if (!deleteBusy) await changeDeletion('DELETE'); }
async function changeDeletion(method) {
  deleteBusy = true; $('deleteButton').disabled = true; $('cancelDeleteButton').disabled = true;
  try {
    const result = await request('/api/account-deletion-request', {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify({})});
    if (result.success !== true) throw new Error('مدیریت درخواست حذف انجام نشد.');
    deletion = result.request; renderDeletion();
  } catch (error) { $('deleteState').textContent = error.message || 'مدیریت درخواست حذف انجام نشد.'; }
  finally { deleteBusy = false; $('deleteButton').disabled = ['requested','processing'].includes(deletion?.status); $('cancelDeleteButton').disabled = false; }
}
async function loadDeletion() {
  try { deletion = (await request('/api/account-deletion-request')).request; renderDeletion(); }
  catch (error) { $('deleteState').textContent = error.message || 'وضعیت درخواست حذف دریافت نشد.'; }
}
async function logout() {
  if (logoutBusy) return; logoutBusy = true; $('logoutButton').disabled = true;
  try { await request('/api/logout', {method:'POST'}); try { localStorage.removeItem('user'); } catch {} location.assign('/'); }
  catch (error) { $('deleteState').textContent = error.message || 'خروج انجام نشد. دوباره تلاش کنید.'; logoutBusy = false; $('logoutButton').disabled = false; }
}
load();
</script></body></html>
