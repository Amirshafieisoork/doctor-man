<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — مدیریت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}header{position:sticky;top:0;z-index:10;padding:14px 24px;background:rgba(5,13,26,.94);border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}header b{color:var(--a);font-size:19px}header a{color:var(--d);text-decoration:none}.wrap{max-width:1320px;margin:auto;padding:22px}.login{max-width:430px;margin:70px auto;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:26px}.input{width:100%;padding:11px 12px;background:var(--s2);border:1px solid var(--b);border-radius:9px;color:var(--t);font:12px Vazirmatn;outline:none}.login .input{margin:12px 0}.btn{border:0;border-radius:9px;padding:9px 12px;background:linear-gradient(135deg,var(--a),#0066ff);color:white;font:700 11px Vazirmatn;cursor:pointer}.btn.red{background:rgba(255,68,102,.1);color:var(--r);border:1px solid rgba(255,68,102,.22)}.btn.green{background:rgba(0,255,157,.08);color:var(--g);border:1px solid rgba(0,255,157,.18)}.dash{display:none}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:16px}.stat{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:14px}.stat b{font-size:20px;display:block}.stat small{color:var(--d)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--s);border:1px solid var(--b);color:var(--d);padding:8px 11px;border-radius:8px;font:11px Vazirmatn;cursor:pointer}.tabs button.active{color:var(--a);border-color:var(--a)}.section{display:none}.section.active{display:block}.card{background:var(--s);border:1px solid var(--b);border-radius:15px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--b)}.head h3{margin:0;font-size:15px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}th{color:var(--d);background:var(--s2)}select{background:var(--s2);border:1px solid var(--b);color:var(--t);padding:6px;border-radius:7px;font:10px Vazirmatn}.badge{font-size:10px;padding:3px 7px;border-radius:20px;background:var(--s2)}.paid,.active{color:var(--g)}.failed,.blocked{color:var(--r)}.pending,.redirected{color:var(--y)}.support{padding:11px 15px;border-bottom:1px solid rgba(255,255,255,.04)}.support small{color:var(--d)}.modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;place-items:center;padding:15px}.modalBg.show{display:grid}.modal{width:min(540px,100%);background:var(--s);border:1px solid var(--b);border-radius:18px;padding:22px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:10px;color:var(--d);display:block;margin-bottom:4px}.full{grid-column:1/-1}.check{display:flex;gap:14px;font-size:11px;color:var(--d);margin:12px 0}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><b>🩺 DrMan Admin</b><a href="/">مشاهده سایت</a></header><main class="wrap"><section class="login" id="login"><h2>ورود مدیر</h2><input id="pass" class="input" type="password" placeholder="رمز مدیریت"><button class="btn" onclick="login()">ورود</button><div id="err" style="color:#ff8da0;font-size:11px;margin-top:8px"></div></section><section class="dash" id="dash"><div id="stats" class="stats"></div><div class="tabs"><button class="active" onclick="tab('users',this)">کاربران</button><button onclick="tab('tests',this)">آزمایش‌ها</button><button onclick="tab('payments',this)">پرداخت‌ها</button><button onclick="tab('plans',this)">پلن‌ها</button><button onclick="tab('support',this)">پشتیبانی</button><button onclick="logoutAdmin()">خروج</button></div><section id="users" class="section active"><div class="card"><div class="head"><h3>کاربران</h3></div><table><thead><tr><th>نام</th><th>موبایل</th><th>پلن</th><th>اعتبار</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="ub"></tbody></table></div></section><section id="tests" class="section"><div class="card"><div class="head"><h3>آزمایش‌ها</h3></div><table><thead><tr><th>تاریخ</th><th>علت</th><th>سن/جنسیت</th><th>وضعیت</th><th>شناسه کاربر</th></tr></thead><tbody id="tb"></tbody></table></div></section><section id="payments" class="section"><div class="card"><div class="head"><h3>پرداخت‌ها</h3></div><table><thead><tr><th>تاریخ</th><th>کاربر</th><th>پلن</th><th>مبلغ</th><th>وضعیت</th><th>پیگیری</th></tr></thead><tbody id="pb"></tbody></table></div></section><section id="plans" class="section"><div class="card"><div class="head"><h3>پلن‌ها</h3><button class="btn" onclick="openPlan()">+ پلن جدید</button></div><table><thead><tr><th>نام</th><th>slug</th><th>قیمت</th><th>سهمیه</th><th>مدت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="plb"></tbody></table></div></section><section id="support" class="section"><div class="card"><div class="head"><h3>آخرین پیام‌های پشتیبانی</h3></div><div id="sb"></div></div></section></section></main><div class="modalBg" id="modalBg"><div class="modal"><h3 id="modalTitle">پلن</h3><input type="hidden" id="pid"><div class="formGrid"><div class="field"><label>نام</label><input class="input" id="pname"></div><div class="field"><label>slug انگلیسی</label><input class="input" id="pslug"></div><div class="field"><label>قیمت (تومان)</label><input class="input" id="pprice" type="number" min="0"></div><div class="field"><label>سهمیه ماهانه (-1 نامحدود)</label><input class="input" id="plimit" type="number" min="-1"></div><div class="field"><label>مدت (روز)</label><input class="input" id="pduration" type="number" min="1" max="365"></div><div class="field"><label>ترتیب نمایش</label><input class="input" id="porder" type="number" min="0"></div><div class="field full"><label>امکانات، هر مورد در یک خط</label><textarea class="input" id="pfeatures" rows="6"></textarea></div></div><div class="check"><label><input type="checkbox" id="ppop"> محبوب</label><label><input type="checkbox" id="pactive"> فعال</label></div><div class="modalActions"><button class="btn" onclick="savePlan()">ذخیره</button><button class="btn red" onclick="closePlan()">انصراف</button></div></div></div><script>let D=null;function fa(n){return Number(n||0).toLocaleString('fa-IR')}function dt(v){return v?new Date(v).toLocaleString('fa-IR'):'—'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});const d=await r.json().catch(()=>({}));if(!r.ok){err.textContent=d.error||'ورود ناموفق';return}sessionStorage.setItem('adminToken','active');load()}function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active')}async function load(){const r=await fetch('/api/admin-dashboard');if(r.status===401){login.style.display='block';dash.style.display='none';return}D=await r.json();if(!D.success)return;login.style.display='none';dash.style.display='block';render()}function render(){const s=D.stats;stats.innerHTML=[['کاربران',s.users],['فعال',s.active_users],['آزمایش‌ها',s.tests],['هشدار جدی',s.danger_tests],['پرداخت موفق',s.paid_payments],['درآمد',fa(s.revenue)+' تومان']].map(x=>`<div class="stat"><b>${typeof x[1]==='number'?fa(x[1]):x[1]}</b><small>${x[0]}</small></div>`).join('');ub.innerHTML=D.users.map(u=>`<tr><td>${esc(u.name||'—')}</td><td>${esc(u.phone)}</td><td><select onchange="setPlan('${u.id}',this.value)">${D.plans.filter(p=>p.active||p.id===u.plan_id).map(p=>`<option value="${p.id}" ${u.plan_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td>${dt(u.plan_expires_at)}</td><td><span class="badge ${esc(u.status)}">${esc(u.status)}</span></td><td><button class="btn ${u.status==='active'?'red':'green'}" onclick="userStatus('${u.id}','${u.status==='active'?'block-user':'unblock-user'}')">${u.status==='active'?'مسدود':'فعال'}</button></td></tr>`).join('');tb.innerHTML=D.tests.map(t=>`<tr><td>${dt(t.created_at)}</td><td>${esc(t.reason||'—')}</td><td>${esc(t.gender||'—')} / ${esc(t.age||'—')}</td><td>${esc(t.status||'normal')}</td><td>${esc(t.user_id||'—')}</td></tr>`).join('');pb.innerHTML=D.payments.map(p=>`<tr><td>${dt(p.created_at)}</td><td>${esc(p.users?.name||p.users?.phone||'—')}</td><td>${esc(p.plans?.name||'—')}</td><td>${fa(p.amount)} تومان</td><td><span class="badge ${esc(p.status)}">${esc(p.status)}</span></td><td>${esc(p.tracking_code||'—')}</td></tr>`).join('');plb.innerHTML=D.plans.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.slug||'—')}</td><td>${fa(p.price)}</td><td>${p.test_limit===-1?'نامحدود':fa(p.test_limit)}</td><td>${fa(p.duration_days||30)} روز</td><td>${p.active?'فعال':'غیرفعال'}</td><td><button class="btn" onclick="openPlan('${p.id}')">ویرایش</button> <button class="btn red" onclick="deactivatePlan('${p.id}')">غیرفعال</button></td></tr>`).join('');sb.innerHTML=D.support.map(m=>`<div class="support"><b>${m.role==='user'?'کاربر':'AI'} — ${esc(m.users?.name||m.users?.phone||'')}</b><br><small>${dt(m.created_at)}</small><div>${esc(m.content)}</div></div>`).join('')||'<div class="support">پیامی وجود ندارد.</div>'}async function action(body){const r=await fetch('/api/admin-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)alert(d.error||'خطا');else load()}function userStatus(id,actionName){action({id,action:actionName})}function setPlan(id,plan_id){action({id,action:'set-plan',plan_id})}function openPlan(id=''){const p=id?D.plans.find(x=>x.id===id):null;pid.value=p?.id||'';pname.value=p?.name||'';pslug.value=p?.slug||'';pprice.value=p?.price??0;plimit.value=p?.test_limit??2;pduration.value=p?.duration_days??30;porder.value=p?.display_order??D.plans.length+1;pfeatures.value=(p?.features||[]).join('\n');ppop.checked=!!p?.is_popular;pactive.checked=p?p.active!==false:true;modalTitle.textContent=p?'ویرایش '+p.name:'پلن جدید';modalBg.classList.add('show')}function closePlan(){modalBg.classList.remove('show')}async function savePlan(){const id=pid.value;const payload={id,name:pname.value.trim(),slug:pslug.value.trim(),price:Number(pprice.value),test_limit:Number(plimit.value),duration_days:Number(pduration.value),display_order:Number(porder.value),features:pfeatures.value.split('\n').map(x=>x.trim()).filter(Boolean),is_popular:ppop.checked,active:pactive.checked};const r=await fetch('/api/manage-plans',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){alert(d.error||'ذخیره نشد');return}closePlan();load()}async function deactivatePlan(id){if(!confirm('این پلن غیرفعال شود؟ سوابق پرداخت و کاربران حفظ می‌شود.'))return;const r=await fetch('/api/manage-plans',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const d=await r.json();if(!r.ok)alert(d.error||'خطا');else load()}function logoutAdmin(){sessionStorage.removeItem('adminToken');location.reload()}if(sessionStorage.getItem('adminToken'))load();</script></body></html>
