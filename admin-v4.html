<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan Admin</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}header{padding:14px 22px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;background:#050d1aee;position:sticky;top:0;z-index:5}a{color:var(--a);text-decoration:none}.wrap{max-width:1320px;margin:auto;padding:18px}.login{max-width:420px;margin:70px auto;background:var(--s);border:1px solid var(--b);padding:24px;border-radius:18px}.input,textarea,select{width:100%;background:var(--s2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:9px;font:11px Vazirmatn}.login .input{margin:12px 0}.btn{border:0;border-radius:8px;padding:8px 11px;background:linear-gradient(135deg,var(--a),#0066ff);color:white;font:700 10px Vazirmatn;cursor:pointer}.red{background:#ff446619!important;color:#ff8098!important;border:1px solid #ff446633!important}.green{background:#00ff9d12!important;color:var(--g)!important;border:1px solid #00ff9d33!important}.dash{display:none}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat,.card{background:var(--s);border:1px solid var(--b);border-radius:13px}.stat{padding:13px}.stat b{font-size:19px;display:block}.stat small,small{color:var(--d)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--s);border:1px solid var(--b);color:var(--d);border-radius:8px;padding:8px 10px;font:10px Vazirmatn;cursor:pointer}.tabs .on{color:var(--a);border-color:var(--a)}.page{display:none}.page.on{display:block}.head{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid var(--b)}.head h3{margin:0;font-size:14px}.table{overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:9px 11px;border-bottom:1px solid #ffffff0a;text-align:right;font-size:10px}th{color:var(--d);background:var(--s2)}td select{width:auto}.pill{padding:3px 7px;border-radius:20px;background:var(--s2)}.active,.paid{color:var(--g)}.blocked,.failed{color:var(--r)}.pending,.redirected{color:var(--y)}.msg{padding:10px 13px;border-bottom:1px solid #ffffff0a;font-size:11px}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:20;place-items:center;padding:12px}.overlay.on{display:grid}.modal{width:min(530px,100%);background:var(--s);border:1px solid var(--b);border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{color:var(--d);font-size:9px;display:block;margin-bottom:3px}.full{grid-column:1/-1}.checks{display:flex;gap:14px;margin:10px 0;color:var(--d);font-size:10px}.actions{display:flex;gap:7px;justify-content:flex-end}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><b style="color:var(--a)">🩺 DrMan Admin</b><a href="/">سایت</a></header><main class="wrap"><section id="loginBox" class="login"><h2>ورود مدیر</h2><input id="pass" class="input" type="password"><button class="btn" id="loginBtn">ورود</button><div id="err" style="color:#ff8098;font-size:10px;margin-top:8px"></div></section><section id="dashBox" class="dash"><div id="stats" class="stats"></div><nav id="tabs" class="tabs"><button data-page="users" class="on">کاربران</button><button data-page="tests">آزمایش‌ها</button><button data-page="payments">پرداخت‌ها</button><button data-page="plans">پلن‌ها</button><button data-page="support">پشتیبانی</button><button id="logoutBtn">خروج</button></nav><section id="users" class="page on"><div class="card"><div class="head"><h3>کاربران</h3></div><div class="table"><table><thead><tr><th>نام</th><th>موبایل</th><th>پلن</th><th>اعتبار</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="ub"></tbody></table></div></div></section><section id="tests" class="page"><div class="card"><div class="head"><h3>آزمایش‌ها</h3></div><div class="table"><table><thead><tr><th>تاریخ</th><th>علت</th><th>سن/جنسیت</th><th>وضعیت</th><th>کاربر</th></tr></thead><tbody id="tb"></tbody></table></div></div></section><section id="payments" class="page"><div class="card"><div class="head"><h3>پرداخت‌ها</h3></div><div class="table"><table><thead><tr><th>تاریخ</th><th>کاربر</th><th>پلن</th><th>مبلغ</th><th>وضعیت</th><th>پیگیری</th></tr></thead><tbody id="pb"></tbody></table></div></div></section><section id="plans" class="page"><div class="card"><div class="head"><h3>پلن‌ها</h3><button class="btn" id="newPlan">+ پلن</button></div><div class="table"><table><thead><tr><th>نام</th><th>slug</th><th>قیمت</th><th>سهمیه</th><th>مدت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="plb"></tbody></table></div></div></section><section id="support" class="page"><div class="card"><div class="head"><h3>پیام‌های پشتیبانی</h3></div><div id="sb"></div></div></section></section></main><div id="overlay" class="overlay"><div class="modal"><h3 id="mt">پلن</h3><input id="pid" type="hidden"><div class="grid"><div class="field"><label>نام</label><input id="pn" class="input"></div><div class="field"><label>slug</label><input id="ps" class="input"></div><div class="field"><label>قیمت تومان</label><input id="pp" class="input" type="number"></div><div class="field"><label>سهمیه (-1 نامحدود)</label><input id="pl" class="input" type="number"></div><div class="field"><label>مدت روز</label><input id="pd" class="input" type="number"></div><div class="field"><label>ترتیب</label><input id="po" class="input" type="number"></div><div class="field full"><label>امکانات؛ هر خط یک مورد</label><textarea id="pf" rows="6"></textarea></div></div><div class="checks"><label><input id="pop" type="checkbox"> محبوب</label><label><input id="pa" type="checkbox"> فعال</label></div><div class="actions"><button id="savePlan" class="btn">ذخیره</button><button id="closePlan" class="btn red">انصراف</button></div></div></div><script>const $=id=>document.getElementById(id);let D=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fa=n=>Number(n||0).toLocaleString('fa-IR');const dt=v=>v?new Date(v).toLocaleString('fa-IR'):'—';async function doLogin(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pass').value})});const d=await r.json().catch(()=>({}));if(!r.ok){$('err').textContent=d.error||'ورود ناموفق';return}sessionStorage.setItem('adminToken','active');load()}async function load(){const r=await fetch('/api/admin-dashboard');if(r.status===401){$('loginBox').style.display='block';$('dashBox').style.display='none';return}D=await r.json();if(!D.success)return;$('loginBox').style.display='none';$('dashBox').style.display='block';render()}function render(){let s=D.stats;$('stats').innerHTML=[['کاربر',s.users],['فعال',s.active_users],['آزمایش',s.tests],['خطر',s.danger_tests],['پرداخت',s.paid_payments],['درآمد',fa(s.revenue)+' تومان']].map(x=>`<div class="stat"><b>${typeof x[1]==='number'?fa(x[1]):x[1]}</b><small>${x[0]}</small></div>`).join('');$('ub').innerHTML=D.users.map(u=>`<tr><td>${esc(u.name||'—')}</td><td>${esc(u.phone)}</td><td><select data-user="${u.id}" class="userPlan">${D.plans.filter(p=>p.active||p.id===u.plan_id).map(p=>`<option value="${p.id}" ${u.plan_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td>${dt(u.plan_expires_at)}</td><td><span class="pill ${esc(u.status)}">${esc(u.status)}</span></td><td><button class="btn userToggle ${u.status==='active'?'red':'green'}" data-id="${u.id}" data-action="${u.status==='active'?'block-user':'unblock-user'}">${u.status==='active'?'مسدود':'فعال'}</button></td></tr>`).join('');$('tb').innerHTML=D.tests.map(t=>`<tr><td>${dt(t.created_at)}</td><td>${esc(t.reason||'—')}</td><td>${esc(t.gender||'—')}/${esc(t.age||'—')}</td><td>${esc(t.status||'normal')}</td><td>${esc(t.user_id||'—')}</td></tr>`).join('');$('pb').innerHTML=D.payments.map(p=>`<tr><td>${dt(p.created_at)}</td><td>${esc(p.users?.name||p.users?.phone||'—')}</td><td>${esc(p.plans?.name||'—')}</td><td>${fa(p.amount)}</td><td><span class="pill ${esc(p.status)}">${esc(p.status)}</span></td><td>${esc(p.tracking_code||'—')}</td></tr>`).join('');$('plb').innerHTML=D.plans.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.slug||'—')}</td><td>${fa(p.price)}</td><td>${p.test_limit===-1?'∞':fa(p.test_limit)}</td><td>${fa(p.duration_days||30)}</td><td>${p.active?'فعال':'غیرفعال'}</td><td><button class="btn editPlan" data-id="${p.id}">ویرایش</button> <button class="btn red deactivate" data-id="${p.id}">غیرفعال</button></td></tr>`).join('');$('sb').innerHTML=D.support.map(m=>`<div class="msg"><b>${m.role==='user'?'کاربر':'AI'} — ${esc(m.users?.name||m.users?.phone||'')}</b><br><small>${dt(m.created_at)}</small><div>${esc(m.content)}</div></div>`).join('')||'<div class="msg">پیامی نیست.</div>'}async function adminAction(body){const r=await fetch('/api/admin-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)alert(d.error||'خطا');else load()}function openPlan(id=''){let p=id?D.plans.find(x=>x.id===id):null;$('pid').value=p?.id||'';$('pn').value=p?.name||'';$('ps').value=p?.slug||'';$('pp').value=p?.price??0;$('pl').value=p?.test_limit??2;$('pd').value=p?.duration_days??30;$('po').value=p?.display_order??D.plans.length+1;$('pf').value=(p?.features||[]).join('\n');$('pop').checked=!!p?.is_popular;$('pa').checked=p?p.active!==false:true;$('mt').textContent=p?'ویرایش '+p.name:'پلن جدید';$('overlay').classList.add('on')}async function persistPlan(){let id=$('pid').value,payload={id,name:$('pn').value.trim(),slug:$('ps').value.trim(),price:Number($('pp').value),test_limit:Number($('pl').value),duration_days:Number($('pd').value),display_order:Number($('po').value),features:$('pf').value.split('\n').map(x=>x.trim()).filter(Boolean),is_popular:$('pop').checked,active:$('pa').checked};let r=await fetch('/api/manage-plans',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok){alert(d.error||'ذخیره نشد');return}$('overlay').classList.remove('on');load()}document.addEventListener('click',e=>{if(e.target.matches('[data-page]')){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('[data-page]').forEach(x=>x.classList.remove('on'));$(e.target.dataset.page).classList.add('on');e.target.classList.add('on')}if(e.target.classList.contains('userToggle'))adminAction({id:e.target.dataset.id,action:e.target.dataset.action});if(e.target.classList.contains('editPlan'))openPlan(e.target.dataset.id);if(e.target.classList.contains('deactivate')&&confirm('پلن غیرفعال شود؟'))fetch('/api/manage-plans',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:e.target.dataset.id})}).then(load)});document.addEventListener('change',e=>{if(e.target.classList.contains('userPlan'))adminAction({id:e.target.dataset.user,action:'set-plan',plan_id:e.target.value})});$('loginBtn').onclick=doLogin;$('logoutBtn').onclick=()=>{sessionStorage.removeItem('adminToken');location.reload()};$('newPlan').onclick=()=>openPlan();$('closePlan').onclick=()=>$('overlay').classList.remove('on');$('savePlan').onclick=persistPlan;if(sessionStorage.getItem('adminToken'))load();</script></body></html>
