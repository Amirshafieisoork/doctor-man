<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DrMan Admin</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}header{padding:14px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--b)}.wrap{max-width:1380px;margin:auto;padding:18px}.login{max-width:420px;margin:70px auto;background:var(--s);border:1px solid var(--b);padding:24px;border-radius:18px}.dash{display:none}.btn,input,select,textarea,button{font-family:inherit}.btn,button{border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:8px;padding:8px 10px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--a),#0870ff);border:0}.green{color:var(--g)}.red{color:#ff8098}.yellow{color:var(--y)}input,select,textarea{background:var(--s2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:9px}.login input{width:100%;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat,.card{background:var(--s);border:1px solid var(--b);border-radius:13px}.stat{padding:13px}.stat b{display:block;font-size:20px;color:var(--a)}small,.muted{color:var(--d)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.tab{font-size:11px}.tab.on{border-color:var(--a);color:var(--a)}.page{display:none}.page.on{display:block}.head{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid var(--b)}.head h3{margin:0}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:9px 10px;border-bottom:1px solid #ffffff0a;text-align:right;font-size:11px}th{color:var(--d);background:var(--s2)}.pill{padding:3px 7px;border-radius:20px;background:var(--s2)}.pending{color:var(--y)}.verified,.active,.paid{color:var(--g)}.rejected,.suspended,.blocked,.failed{color:var(--r)}.msg{padding:10px;border-bottom:1px solid #ffffff0a}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><b style="color:var(--a)">🩺 DrMan Admin</b><a href="/" style="color:var(--a)">سایت</a></header><main class="wrap"><section id="login" class="login"><h2>ورود مدیر</h2><input id="pass" type="password" placeholder="رمز مدیر"><button class="primary" onclick="login()">ورود</button><div id="err" class="red"></div></section><section id="dash" class="dash"><div id="stats" class="stats"></div><nav class="tabs"><button class="tab on" data-p="doctors">پزشکان</button><button class="tab" data-p="users">کاربران</button><button class="tab" data-p="appointments">نوبت‌ها</button><button class="tab" data-p="tests">آزمایش‌ها</button><button class="tab" data-p="payments">پرداخت‌ها</button><button class="tab" data-p="plans">پلن‌ها</button><button class="tab" data-p="support">پشتیبانی</button><button onclick="logout()">خروج</button></nav><section id="doctors" class="page on"><div class="card"><div class="head"><h3>پزشکان و احراز حرفه‌ای</h3></div><div class="table"><table><thead><tr><th>نام</th><th>نظام پزشکی</th><th>تخصص</th><th>شهر</th><th>وضعیت</th><th>عمومی</th><th>عملیات</th></tr></thead><tbody id="db"></tbody></table></div></div></section><section id="users" class="page"><div class="card"><div class="head"><h3>کاربران و پلن</h3></div><div class="table"><table><thead><tr><th>نام</th><th>موبایل</th><th>نوع</th><th>پلن</th><th>انقضا</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="ub"></tbody></table></div></div></section><section id="appointments" class="page"><div class="card"><div class="head"><h3>نوبت‌ها</h3></div><div class="table"><table><thead><tr><th>زمان</th><th>بیمار</th><th>پزشک</th><th>نوع</th><th>وضعیت</th><th>علت</th></tr></thead><tbody id="ab"></tbody></table></div></div></section><section id="tests" class="page"><div class="card"><div class="head"><h3>آزمایش‌ها</h3></div><div class="table"><table><thead><tr><th>تاریخ</th><th>علت</th><th>وضعیت</th><th>کاربر</th></tr></thead><tbody id="tb"></tbody></table></div></div></section><section id="payments" class="page"><div class="card"><div class="head"><h3>پرداخت‌ها</h3></div><div class="table"><table><thead><tr><th>تاریخ</th><th>کاربر</th><th>پلن</th><th>مبلغ</th><th>وضعیت</th><th>پیگیری</th></tr></thead><tbody id="pb"></tbody></table></div></div></section><section id="plans" class="page"><div class="card"><div class="head"><h3>پلن‌ها</h3></div><div class="table"><table><thead><tr><th>نام</th><th>قیمت</th><th>سهمیه</th><th>مدت</th><th>فعال</th></tr></thead><tbody id="plb"></tbody></table></div></div></section><section id="support" class="page"><div class="card"><div class="head"><h3>پشتیبانی AI</h3></div><div id="sb"></div></div></section></section></main><script>const $=i=>document.getElementById(i);let D;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('fa-IR'):'—';const fa=n=>Number(n||0).toLocaleString('fa-IR');async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pass').value})});const d=await r.json().catch(()=>({}));if(!r.ok){$('err').textContent=d.error||'ورود ناموفق';return}load()}async function load(){const r=await fetch('/api/admin-dashboard',{credentials:'include'});if(r.status===401){$('login').style.display='block';$('dash').style.display='none';return}D=await r.json();if(!D.success)return;$('login').style.display='none';$('dash').style.display='block';render()}async function act(action,id,extra={}){const r=await fetch('/api/admin-action',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id,...extra})});const d=await r.json();if(!r.ok)alert(d.error||'خطا');else load()}function render(){const s=D.stats;$('stats').innerHTML=[['کاربر',s.users],['پرونده',s.patients],['پزشک',s.doctors],['پزشک منتظر',s.pending_doctors],['نوبت',s.appointments],['درآمد',fa(s.revenue)+' تومان']].map(x=>`<div class="stat"><b>${typeof x[1]==='number'?fa(x[1]):x[1]}</b><small>${x[0]}</small></div>`).join('');$('db').innerHTML=(D.doctors||[]).map(d=>`<tr><td>${esc(d.full_name)}</td><td>${esc(d.medical_license_number||'—')}</td><td>${esc(d.specialty)}${d.sub_specialty?' / '+esc(d.sub_specialty):''}</td><td>${esc(d.city||'—')}</td><td><span class="pill ${esc(d.verification_status)}">${esc(d.verification_status)}</span></td><td>${d.public_profile?'بله':'خیر'}</td><td>${d.verification_status!=='verified'?`<button class="primary" onclick="act('approve-doctor','${d.id}')">تأیید</button>`:''} ${d.verification_status==='pending'?`<button class="red" onclick="act('reject-doctor','${d.id}')">رد</button>`:''} ${d.verification_status==='verified'?`<button class="yellow" onclick="act('suspend-doctor','${d.id}')">تعلیق</button>`:''}</td></tr>`).join('');$('ub').innerHTML=(D.users||[]).map(u=>`<tr><td>${esc(u.name||'—')}</td><td>${esc(u.phone)}</td><td>${esc(u.account_type||'patient')}</td><td><select onchange="act('set-plan','${u.id}',{plan_id:this.value})">${(D.plans||[]).filter(p=>p.active||p.id===u.plan_id).map(p=>`<option value="${p.id}" ${u.plan_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td>${dt(u.plan_expires_at)}</td><td><span class="pill ${esc(u.status)}">${esc(u.status)}</span></td><td><button class="${u.status==='active'?'red':'green'}" onclick="act('${u.status==='active'?'block-user':'unblock-user'}','${u.id}')">${u.status==='active'?'مسدود':'فعال'}</button></td></tr>`).join('');$('ab').innerHTML=(D.appointments||[]).map(a=>`<tr><td>${dt(a.starts_at)}</td><td>${esc(a.patients?.display_name||'—')}</td><td>${esc(a.doctor_profiles?.full_name||'—')}</td><td>${esc(a.mode)}</td><td>${esc(a.status)}</td><td>${esc(a.reason||'—')}</td></tr>`).join('');$('tb').innerHTML=(D.tests||[]).map(t=>`<tr><td>${dt(t.created_at)}</td><td>${esc(t.reason||'—')}</td><td>${esc(t.status||'—')}</td><td>${esc(t.user_id||'—')}</td></tr>`).join('');$('pb').innerHTML=(D.payments||[]).map(p=>`<tr><td>${dt(p.created_at)}</td><td>${esc(p.users?.name||p.users?.phone||'—')}</td><td>${esc(p.plans?.name||'—')}</td><td>${fa(p.amount)}</td><td>${esc(p.status)}</td><td>${esc(p.tracking_code||'—')}</td></tr>`).join('');$('plb').innerHTML=(D.plans||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${fa(p.price)} تومان</td><td>${p.test_limit===-1?'∞':fa(p.test_limit)}</td><td>${fa(p.duration_days||30)} روز</td><td>${p.active?'بله':'خیر'}</td></tr>`).join('');$('sb').innerHTML=(D.support||[]).map(m=>`<div class="msg"><b>${esc(m.users?.name||m.users?.phone||m.role)}</b> <small>${dt(m.created_at)}</small><div>${esc(m.content)}</div></div>`).join('')||'<div class="msg">پیامی نیست.</div>'}document.addEventListener('click',e=>{if(e.target.dataset.p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$(e.target.dataset.p).classList.add('on');e.target.classList.add('on')}});async function logout(){await fetch('/api/logout',{method:'POST',credentials:'include'});location.reload()}load();</script></body></html>
