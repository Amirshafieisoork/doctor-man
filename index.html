```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrMan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#f5f7fb;
padding:20px;
}

.hero{
text-align:center;
padding:60px 20px;
}

.logo{
font-size:48px;
font-weight:bold;
color:#2563eb;
}

.subtitle{
font-size:22px;
margin-top:15px;
color:#444;
}

.desc{
max-width:700px;
margin:25px auto;
line-height:2;
color:#666;
}

.btn{
display:inline-block;
background:#2563eb;
color:white;
padding:14px 30px;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

.features{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:50px 20px;
}

.card{
background:white;
width:280px;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
color:#2563eb;
}

#resultArea{
background:white;
padding:20px;
border-radius:15px;
max-width:700px;
margin:30px auto;
display:none;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.footer{
text-align:center;
padding:30px;
color:#777;
}

img{
max-width:350px;
width:100%;
border-radius:15px;
margin-top:20px;
}

</style>
</head>

<body>

<section class="hero">

<div class="logo">
DrMan
</div>

<div class="subtitle">
دستیار هوشمند سلامت شما
</div>

<div class="desc">
آپلود عکس آزمایش و دریافت تفسیر هوشمند به زبان ساده.
</div>

<input type="file"
id="labImage"
accept="image/*"
style="display:none">

<label for="labImage" class="btn">
آپلود عکس آزمایش
</label>

<div id="previewArea"></div>

<div id="actionArea"></div>

<div id="resultArea"></div>

</section>

<section class="features">

<div class="card">
<h3>تفسیر آزمایش</h3>
<p>
فهم ساده نتایج آزمایش.
</p>
</div>

<div class="card">
<h3>پرونده سلامت</h3>
<p>
نگهداری سوابق پزشکی.
</p>
</div>

<div class="card">
<h3>یادآوری پزشکی</h3>
<p>
یادآوری آزمایش و مراجعه.
</p>
</div>

</section>

<div class="footer">
© DrMan 2025
</div>

<script>

document.getElementById("labImage")
.addEventListener("change", function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

document.getElementById("previewArea").innerHTML = `
<h3>تصویر انتخاب شده</h3>
<img src="${event.target.result}">
`;

document.getElementById("actionArea").innerHTML = `
<br>
<button id="analyzeBtn"
style="
background:#2563eb;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
font-size:16px;
">
تحلیل آزمایش
</button>
`;

document.getElementById("analyzeBtn")
.addEventListener("click", function(){

const resultArea =
document.getElementById("resultArea");

resultArea.style.display = "block";

resultArea.innerHTML = `
<h3>در حال تحلیل آزمایش...</h3>
<p>لطفاً چند لحظه صبر کنید.</p>
`;

setTimeout(()=>{

resultArea.innerHTML = `
<h3>نتیجه تحلیل آزمایش</h3>

<p>
DrMan آماده اتصال به هوش مصنوعی است.
</p>

<p>
در نسخه بعدی نتیجه واقعی آزمایش در این قسمت نمایش داده خواهد شد.
</p>
`;

},2000);

});

};

reader.readAsDataURL(file);

});

</script>

</body>
</html>
```
