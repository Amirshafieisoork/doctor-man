<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrMan — دستیار هوشمند سلامت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050d1a;
  --surface: #0a1628;
  --surface2: #0f1e36;
  --accent: #00d4ff;
  --accent2: #0099cc;
  --green: #00ff9d;
  --red: #ff4466;
  --text: #e8f4ff;
  --text-dim: #7aa0c4;
  --border: rgba(0,212,255,0.15);
  --glow: 0 0 30px rgba(0,212,255,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  z-index: 0;
}
.orb2 {
  position: fixed;
  bottom: -200px;
  left: -200px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(0,255,157,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  background: rgba(5,13,26,0.8);
  position: sticky;
  top: 0;
}
.logo-wrap { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--green));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; box-shadow: 0 0 20px rgba(0,212,255,0.4);
}
.logo-text {
  font-size: 22px; font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.badge {
  font-size: 11px; background: rgba(0,212,255,0.1);
  border: 1px solid var(--border); color: var(--accent);
  padding: 4px 10px; border-radius: 20px;
}
/* Hero, Stats, Card styles ... (بقیه استایل‌ها بدون تغییر) */
.hero { position: relative; z-index: 1; text-align: center; padding: 80px 20px 60px; }
.hero h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 900; line-height: 1.2; margin-bottom: 20px; }
.hero p { font-size: 17px; color: var(--text-dim); max-width: 500px; margin: 0 auto 40px; }
.stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 60px; flex-wrap: wrap; }
.stat-num { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px; box-shadow: var(--glow); }
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 750px; margin: 0 auto 80px; padding: 0 20px; }
/* بقیه استایل‌ها همان قبلی */
</style>
</head>
<body>
<div class="orb2"></div>

<header>
  <div class="logo-wrap">
    <div class="logo-icon">🩺</div>
    <div class="logo-text">DrMan</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="/auth.html" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);border-radius:10px;padding:8px 16px;color:#00d4ff;font-size:13px;text-decoration:none;">ورود / ثبت‌نام</a>
    <div class="badge">AI HEALTH</div>
  </div>
</header>

<section class="hero">
  <div class="hero-tag">هوش مصنوعی پزشکی فعال است</div>
  <h1>تفسیر <span>هوشمند</span><br>آزمایش‌های پزشکی</h1>
  <p>عکس آزمایشت رو آپلود کن، در چند ثانیه تفسیر کامل دریافت کن</p>
  <div class="stats">
    <div class="stat"><div class="stat-num">+۵۰</div><div class="stat-label">نوع آزمایش</div></div>
    <div class="stat"><div class="stat-num">AI</div><div class="stat-label">تحلیل پیشرفته</div></div>
    <div class="stat"><div class="stat-num">۲۴/۷</div><div class="stat-label">در دسترس</div></div>
  </div>
</section>

<div class="main-wrap">
  <div class="card">
    <!-- فرم آپلود آزمایش (بدون تغییر) -->
    <!-- ... کد قبلی آپلود و تحلیل ... -->
  </div>
</div>

<!-- ==================== بخش پلن‌ها ==================== -->
<section style="position:relative;z-index:1;max-width:1200px;margin:80px auto;padding:0 20px;">
  <div style="text-align:center;margin-bottom:50px;">
    <h2 style="font-size:32px;font-weight:900;margin-bottom:12px;">پلن‌های اشتراک DrMan</h2>
    <p style="color:var(--text-dim);font-size:16px;">انتخاب کنید و امکانات بیشتری داشته باشید</p>
  </div>
  <div id="plansContainer" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:28px;"></div>
</section>

<div class="features">
  <!-- ویژگی‌ها بدون تغییر -->
</div>

<footer>© DrMan 2025 — دستیار هوشمند سلامت</footer>

<script>
// === کدهای قبلی آپلود و تحلیل (بدون تغییر) ===
const labImage = document.getElementById('labImage');
// ... (همه کدهای قبلی آپلود را اینجا نگه دار) ...

// ====================== پلن‌ها ======================
function loadUserPlans() {
  const container = document.getElementById('plansContainer');
  if (!container) return;

  let plans = JSON.parse(localStorage.getItem('drManPlans') || '[]');

  if (plans.length === 0) {
    plans = [
      { name: "طلایی", price: 299000, icon: "🥇", popular: false, features: ["آزمایش نامحدود", "تفسیر هوشمند کامل", "پرونده سلامت", "پشتیبانی اختصاصی"] },
      { name: "نقره‌ای", price: 149000, icon: "🥈", popular: true, features: ["۲۰ آزمایش در ماه", "تفسیر پیشرفته", "پرونده سلامت", "مقایسه نتایج"] },
      { name: "برنزی", price: 89000, icon: "🥉", popular: false, features: ["۳ آزمایش در ماه", "تفسیر پایه", "پرونده سلامت"] }
    ];
  }

  let html = '';
  plans.forEach(plan => {
    const isPopular = plan.popular || plan.name.includes("نقره");
    html += `
      <div style="background:var(--surface);border:2px solid ${isPopular ? '#ffd060' : 'var(--border)'};border-radius:24px;padding:32px 24px;text-align:center;position:relative;transition:all 0.3s;${isPopular ? 'box-shadow:0 0 30px rgba(255,208,96,0.25);' : ''}">
        ${isPopular ? `<div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#ffd060;color:#000;font-size:12px;font-weight:900;padding:6px 24px;border-radius:30px;">محبوب‌ترین ⭐</div>` : ''}
        <div style="font-size:48px;margin-bottom:16px;">${plan.icon}</div>
        <div style="font-size:24px;font-weight:700;margin-bottom:8px;">${plan.name}</div>
        <div style="font-size:36px;font-weight:900;color:var(--accent);margin:12px 0;">${plan.price.toLocaleString('fa-IR')}</div>
        <div style="color:var(--text-dim);margin-bottom:28px;font-size:14px;">تومان / ماه</div>
        <ul style="list-style:none;text-align:right;margin-bottom:32px;line-height:2.4;font-size:14.5px;color:var(--text);">
          ${plan.features.map(f => `<li>✅ ${f}</li>`).join('')}
        </ul>
        <button onclick="selectPlan('${plan.name}', ${plan.price})" style="width:100%;padding:16px;background:linear-gradient(135deg,#00d4ff,#0066ff);border:none;border-radius:14px;color:white;font-weight:700;font-size:15px;cursor:pointer;">
          انتخاب این پلن
        </button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function selectPlan(planName, price) {
  if (confirm(`آیا پلن ${planName} را انتخاب می‌کنید؟\nمبلغ: ${price.toLocaleString('fa-IR')} تومان`)) {
    localStorage.setItem('currentPlan', JSON.stringify({
      name: planName,
      price: price,
      startDate: new Date().toISOString(),
      status: "active"
    }));
    alert(`✅ پلن ${planName} فعال شد!`);
  }
}

// اجرای پلن‌ها + کدهای قبلی
document.addEventListener('DOMContentLoaded', function() {
  loadUserPlans();
  // بقیه کدهای قبلی شما (آپلود و ...) اینجا اجرا می‌شوند
});
</script>
</body>
</html>
