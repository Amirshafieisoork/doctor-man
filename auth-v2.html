<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — ورود و ثبت‌نام</title><link rel="icon" type="image/png" href="/assets/drman-logo.png"><link rel="apple-touch-icon" href="/assets/drman-logo.png"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--r:#ff4466;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:55px 55px;pointer-events:none}.card{position:relative;width:min(460px,100%);background:var(--s);border:1px solid var(--b);border-radius:24px;padding:30px;box-shadow:0 0 45px rgba(0,212,255,.09)}.brand{text-align:center;margin-bottom:22px}.logo{width:66px;height:66px;border-radius:18px;object-fit:cover;display:block;margin:auto;box-shadow:0 8px 24px rgba(0,212,255,.18)}.brand h1{font-size:24px;margin:10px 0 4px;color:var(--a)}.brand p{margin:0;color:var(--d);font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:20px}.tab{border:0;background:transparent;color:var(--d);font:700 13px Vazirmatn;padding:10px;border-radius:9px;cursor:pointer}.tab.active{background:rgba(0,212,255,.12);color:var(--a)}.form{display:none}.form.active{display:block}.group{margin-bottom:13px}label{display:block;color:var(--d);font-size:12px;margin-bottom:6px}input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--b);background:var(--s2);color:var(--t);font:13px Vazirmatn;outline:none}input:focus{border-color:var(--a)}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,var(--a),#0066ff);color:white;font:700 14px Vazirmatn;cursor:pointer;margin-top:4px}.btn:disabled{opacity:.5}.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.7}.msg.show{display:block}.msg.error{background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.25);color:#ff9aae}.msg.ok{background:rgba(0,255,157,.07);border:1px solid rgba(0,255,157,.2);color:var(--g)}.back{display:block;text-align:center;color:var(--d);text-decoration:none;font-size:12px;margin-top:18px}</style></head><body><main class="card"><div class="brand"><img class="logo" src="/assets/drman-logo.png" alt="لوگوی دکتر من"><h1>DrMan</h1><p>ورود امن به پرونده سلامت</p></div><div class="tabs"><button id="loginTab" class="tab active" onclick="show('login')">ورود</button><button id="registerTab" class="tab" onclick="show('register')">ثبت‌نام</button></div><form id="login" class="form active" onsubmit="login(event)"><div class="group"><label>شماره موبایل</label><input id="lp" inputmode="numeric" autocomplete="tel" placeholder="09xxxxxxxxx"></div><div class="group"><label>رمز عبور</label><input id="lw" type="password" autocomplete="current-password"></div><button id="lb" class="btn">ورود به حساب</button></form><form id="register" class="form" onsubmit="register(event)"><div class="group"><label>نام</label><input id="rn" maxlength="80" autocomplete="name" placeholder="نام شما"></div><div class="group"><label>شماره موبایل</label><input id="rp" inputmode="numeric" autocomplete="tel" placeholder="09xxxxxxxxx"></div><div class="group"><label>رمز عبور (حداقل ۸ کاراکتر)</label><input id="rw" type="password" minlength="8" maxlength="128" autocomplete="new-password"></div><button id="rb" class="btn">ساخت حساب رایگان</button></form><div id="msg" class="msg"></div><a class="back" href="/">← بازگشت به DrMan</a></main><script>function norm(v){return String(v).trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[\s-]/g,'')}function show(id){document.querySelectorAll('.form').forEach(x=>x.classList.toggle('active',x.id===id));document.getElementById('loginTab').classList.toggle('active',id==='login');document.getElementById('registerTab').classList.toggle('active',id==='register');document.getElementById('msg').className='msg'}function message(t,type){const m=document.getElementById('msg');m.textContent=t;m.className='msg show '+type}async function req(url,payload,b){b.disabled=true;try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'عملیات انجام نشد');localStorage.removeItem('user');message('موفق بود؛ در حال ورود به پرونده…','ok');setTimeout(()=>location.href='/profile.html',400)}catch(e){message(e.message,'error')}finally{b.disabled=false}}function login(e){e.preventDefault();const phone=norm(lp.value),password=lw.value;if(!/^09\d{9}$/.test(phone)||!password){message('شماره موبایل و رمز عبور را صحیح وارد کنید.','error');return}req('/api/login',{phone,password},lb)}function register(e){e.preventDefault();const phone=norm(rp.value),password=rw.value,name=rn.value.trim();if(!/^09\d{9}$/.test(phone)||password.length<8){message('شماره موبایل معتبر و رمز حداقل ۸ کاراکتری لازم است.','error');return}req('/api/register',{name,phone,password},rb)}fetch('/api/account').then(r=>{if(r.ok)location.href='/profile.html'}).catch(()=>{});</script></body></html>
