<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrMan — پرونده سلامت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e2937; transition: all 0.3s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); }
    .teal-accent { color: #14b8a6; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <div class="max-w-6xl mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-teal-500 rounded-xl flex items-center justify-center text-2xl">🧬</div>
        <h1 class="text-3xl font-bold teal-accent">DrMan</h1>
      </div>
      <a href="/" class="bg-teal-600 hover:bg-teal-500 px-5 py-2.5 rounded-2xl flex items-center gap-2">
        <i class="fas fa-plus"></i> آزمایش جدید
      </a>
    </div>

    <!-- User Info -->
    <div class="card rounded-3xl p-6 mb-8 flex flex-col md:flex-row gap-6 items-center md:items-start">
      <div class="w-24 h-24 bg-gradient-to-br from-teal-400 to-blue-500 rounded-2xl flex items-center justify-center text-5xl shadow-lg">
        👤
      </div>
      <div class="flex-1 text-center md:text-right">
        <h2 class="text-2xl font-semibold">امیرحسین</h2>
        <p class="text-gray-400 text-lg">۰۹۱۳۵۱۷۴۵۷۷</p>
      </div>
      <div class="text-teal-400 text-sm">فعال از ۱۴۰۴</div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
      <div class="card rounded-3xl p-6 text-center">
        <div class="text-4xl mb-2">⚠️</div>
        <div class="text-3xl font-bold text-orange-400">۲</div>
        <div class="text-sm text-gray-400 mt-1">نیاز به توجه</div>
      </div>
      <div class="card rounded-3xl p-6 text-center">
        <div class="text-4xl mb-2">✅</div>
        <div class="text-3xl font-bold text-emerald-400">۸</div>
        <div class="text-sm text-gray-400 mt-1">نتایج نرمال</div>
      </div>
      <div class="card rounded-3xl p-6 text-center">
        <div class="text-4xl mb-2">📋</div>
        <div class="text-3xl font-bold">۱۲</div>
        <div class="text-sm text-gray-400 mt-1">کل آزمایش‌ها</div>
      </div>
      <div class="card rounded-3xl p-6 text-center">
        <div class="text-4xl mb-2">📅</div>
        <div class="text-3xl font-bold">۳</div>
        <div class="text-sm text-gray-400 mt-1">ماه فعال</div>
      </div>
    </div>

    <!-- History -->
    <div class="card rounded-3xl p-8">
      <h3 class="text-xl font-semibold mb-6 flex items-center gap-3">
        <i class="fas fa-history"></i> تاریخچه آزمایش‌ها
      </h3>
      
      <div class="space-y-4">
        <!-- Sample items - بعداً با JS داینامیک می‌کنی -->
        <div class="bg-slate-800 rounded-2xl p-5 flex justify-between items-center hover:bg-slate-700 transition-colors">
          <div>
            <p class="font-medium">آزمایش خون کامل (CBC)</p>
            <p class="text-sm text-gray-400">۱۴۰۴/۰۴/۱۵ • ۳ صفحه</p>
          </div>
          <div class="text-emerald-400 font-medium">نرمال</div>
          <button onclick="alert('جزئیات باز شد')" class="bg-teal-600 hover:bg-teal-500 px-6 py-2 rounded-xl text-sm">مشاهده</button>
        </div>
        
        <!-- می‌تونی آیتم‌های بیشتر اضافه کنی -->
      </div>
    </div>
  </div>

</body>
</html>
