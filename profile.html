<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrMan — پرونده سلامت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050d1a;
  --surface: #0a1628;
  --surface2: #0f1e36;
  --surface3: #162040;
  --accent: #00d4ff;
  --accent2: #0066ff;
  --green: #00ff9d;
  --yellow: #ffd060;
  --red: #ff4466;
  --purple: #a855f7;
  --text: #e8f4ff;
  --text-dim: #7aa0c4;
  --border: rgba(0,212,255,0.12);
  --glow: 0 0 30px rgba(0,212,255,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  background: rgba(5,13,26,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--green));
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 0 15px rgba(0,212,255,0.3);
}

.logo-text {
  font-size: 20px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 8px 16px;
}

.user-avatar {
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.user-name {
  font-size: 13px;
  font-weight: 600;
}

.back-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 16px;
  color: var(--text-dim);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.back-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.layout {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 24px;
}

.sidebar {}

.profile-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 16px;
  box-shadow: var(--glow);
}

.profile-avatar {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin: 0 auto 16px;
  box-shadow: 0 0 25px rgba(0,212,255,0.3);
}

.profile-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.profile-phone {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 20px;
  direction: ltr;
}

.profile-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.p-stat {
  background: var(--surface2);
  border-radius: 12px;
  padding: 12px;
}

.p-stat-num {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.p-stat-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

.quick-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
}

.quick-title {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.info-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 13px;
}

.info-item:last-child { border-bottom: none; }

.info-label { color: var(--text-dim); }
.info-value { font-weight: 600; }

.main-content {}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: linear-gradient(to bottom, var(--accent), var(--green));
  border-radius: 2px;
}

.new-test-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 12px;
  padding: 10px 20px;
  color: white;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 15px rgba(0,212,255,0.25);
}

.new-test-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,212,255,0.35);
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  transition: all 0.3s;
}

.summary-card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}

.summary-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 12px;
}

.summary-icon.blue { background: rgba(0,212,255,0.1); }
.summary-icon.green { background: rgba(0,255,157,0.1); }
.summary-icon.yellow { background: rgba(255,208,96,0.1); }

.summary-num {
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 4px;
}

.summary-num.blue { color: var(--accent); }
.summary-num.green { color: var(--green); }
.summary-num.yellow { color: var(--yellow); }

.summary-label {
  font-size: 12px;
  color: var(--text-dim);
}

.records-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.record-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 24px;
  transition: all 0.3s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.record-card::before {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(to bottom, var(--accent), var(--green));
  border-radius: 0 4px 4px 0;
  opacity: 0;
  transition: opacity 0.3s;
}

.record-card:hover {
  border-color: rgba(0,212,255,0.3);
}

.record-card:hover::before { opacity: 1; }

.record-card.warning { border-color: rgba(255,208,96,0.2); }
.record-card.warning::before { background: var(--yellow); }

.record-card.danger { border-color: rgba(255,68,102,0.2); }
.record-card.danger::before { background: var(--red); }

.record-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
  cursor: pointer;
}

.record-info {}

.record-reason {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}

.record-meta {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.record-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

.record-status {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.status-badge {
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
}

.status-badge.normal {
  background: rgba(0,255,157,0.1);
  color: var(--green);
  border: 1px solid rgba(0,255,157,0.2);
}

.status-badge.warning {
  background: rgba(255,208,96,0.1);
  color: var(--yellow);
  border: 1px solid rgba(255,208,96,0.2);
}

.status-badge.danger {
  background: rgba(255,68,102,0.1);
  color: var(--red);
  border: 1px solid rgba(255,68,102,0.2);
}

.record-date {
  font-size: 11px;
  color: var(--text-dim);
}

.record-summary {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.04);
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
  display: none;
  white-space: pre-wrap;
}

.record-summary.open { display: block; }

.record-toggle {
  font-size: 11px;
  color: var(--accent);
  margin-top: 10px;
  cursor: pointer;
  display: inline-block;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-text {
  font-size: 15px;
  margin-bottom: 8px;
}

.empty-sub {
  font-size: 13px;
  opacity: 0.6;
  margin-bottom: 20px;
}

.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 20px 16px; }
  .summary-grid { grid-template-columns: 1fr 1fr; }
  header { padding: 14px 16px; }
}

@media (max-width: 500px) {
  .summary-grid { grid-template-columns: 1fr; }
  .record-top { flex-direction: column; gap: 10px; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.sidebar { animation: fadeUp 0.5s ease 0.1s both; }
.main-content { animation: fadeUp 0.5s ease 0.2s both; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-icon">🩺</div>
    <div class="logo-text">DrMan</div>
  </div>
  <div class="header-left">
    <div class="user-info">
      <div class="user-avatar">👤</div>
      <span class="user-name" id="userName">کاربر</span>
    </div>
    <a href="/" class="back-btn">🔬 آزمایش جدید</a>
    <a href="/auth.html" onclick="localStorage.removeItem('user')" class="back-btn" style="color:var(--red);border-color:rgba(255,68,102,0.2)">🚪 خروج</a>
  </div>
</header>

<div class="layout">

  <div class="sidebar">

    <div class="profile-card">
      <div class="profile-avatar">👤</div>
      <div class="profile-name" id="profileName">کاربر</div>
      <div class="profile-phone" id="profilePhone">—</div>
      <div class="profile-stats">
        <div class="p-stat">
          <div class="p-stat-num" id="totalTestsSide">۰</div>
          <div class="p-stat-label">آزمایش</div>
        </div>
        <div class="p-stat">
          <div class="p-stat-num" id="activeMonths">۰</div>
          <div class="p-stat-label">ماه فعال</div>
        </div>
      </div>
    </div>

    <div class="quick-info">
      <div class="quick-title">📋 اطلاعات سریع</div>
      <div class="info-item">
        <span class="info-label">آخرین آزمایش</span>
        <span class="info-value" id="lastTestDate">—</span>
      </div>
      <div class="info-item">
        <span class="info-label">کل آزمایش‌ها</span>
        <span class="info-value" id="totalTestsInfo">۰</span>
      </div>
    </div>

  </div>

  <div class="main-content">

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-icon blue">🔬</div>
        <div class="summary-num blue" id="summaryTotal">۰</div>
        <div class="summary-label">کل آزمایش‌ها</div>
      </div>
      <div class="summary-card">
        <div class="summary-icon green">✅</div>
        <div class="summary-num green" id="summaryNormal">۰</div>
        <div class="summary-label">نتایج نرمال</div>
      </div>
      <div class="summary-card">
        <div class="summary-icon yellow">⚠️</div>
        <div class="summary-num yellow" id="summaryWarning">۰</div>
        <div class="summary-label">نیاز به توجه</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">تاریخچه آزمایش‌ها</div>
      <a href="/" class="new-test-btn">+ آزمایش جدید</a>
    </div>

    <div id="recordsContainer">
      <div class="loading-state">در حال بارگذاری اطلاعات...</div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://dhciuxijsagtskrrtxua.supabase.co";
const SUPABASE_KEY = "sb_publishable_iFvEeEdG6dEvdYrqOhAVew_WmGr4276";

const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!user.id) {
  window.location.href = '/auth.html';
}

if (user.name) {
  document.getElementById('userName').textContent = user.name;
  document.getElementById('profileName').textContent = user.name;
}
if (user.phone) {
  document.getElementById('profilePhone').textContent = user.phone;
}

function detectStatus(analysis) {
  if (!analysis) return 'normal';
  const text = analysis.toLowerCase();
  if (text.includes('غیرنرمال') || text.includes('خطر') || text.includes('فوری') || text.includes('بالا') && text.includes('هشدار')) {
    return 'danger';
  }
  if (text.includes('توجه') || text.includes('پایین') || text.includes('بالاتر') || text.includes('مثبت')) {
    return 'warning';
  }
  return 'normal';
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('fa-IR');
}

async function loadResults() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/test_results?user_id=eq.${user.id}&select=*&order=created_at.desc`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const results = await res.json();

    renderResults(results);
  } catch (e) {
    document.getElementById('recordsContainer').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">خطا در بارگذاری اطلاعات</div>
        <div class="empty-sub">لطفاً صفحه را رفرش کنید</div>
      </div>
    `;
  }
}

function renderResults(results) {
  const total = results.length;
  let normalCount = 0, warningCount = 0, dangerCount = 0;

  results.forEach(r => {
    const status = detectStatus(r.analysis);
    if (status === 'normal') normalCount++;
    else if (status === 'warning') warningCount++;
    else dangerCount++;
  });

  document.getElementById('summaryTotal').textContent = total.toLocaleString('fa-IR');
  document.getElementById('summaryNormal').textContent = normalCount.toLocaleString('fa-IR');
  document.getElementById('summaryWarning').textContent = (warningCount + dangerCount).toLocaleString('fa-IR');
  document.getElementById('totalTestsSide').textContent = total.toLocaleString('fa-IR');
  document.getElementById('totalTestsInfo').textContent = total.toLocaleString('fa-IR');

  if (results.length > 0) {
    document.getElementById('lastTestDate').textContent = formatDate(results[0].created_at);

    const months = new Set(results.map(r => {
      const d = new Date(r.created_at);
      return `${d.getFullYear()}-${d.getMonth()}`;
    }));
    document.getElementById('activeMonths').textContent = months.size.toLocaleString('fa-IR');
  }

  const container = document.getElementById('recordsContainer');

  if (results.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔬</div>
        <div class="empty-text">هنوز آزمایشی ثبت نشده</div>
        <div class="empty-sub">برای شروع، یک آزمایش جدید آپلود کنید</div>
        <a href="/" class="new-test-btn">+ آزمایش جدید</a>
      </div>
    `;
    return;
  }

  container.innerHTML = `<div class="records-list">${results.map((r, i) => {
    const status = detectStatus(r.analysis);
    const statusLabel = status === 'normal' ? '✓ نرمال' : status === 'warning' ? '⚠ نیاز به توجه' : '⛔ غیرنرمال';
    const statusClass = status;

    return `
      <div class="record-card ${statusClass}">
        <div class="record-top" onclick="toggleRecord(${i})">
          <div class="record-info">
            <div class="record-reason">${r.reason || 'آزمایش عمومی'}</div>
            <div class="record-meta">
              <span>👤 ${r.gender || '—'}، ${r.age || '—'} سال</span>
            </div>
          </div>
          <div class="record-status">
            <span class="status-badge ${statusClass}">${statusLabel}</span>
            <span class="record-date">${formatDate(r.created_at)}</span>
          </div>
        </div>
        <div class="record-summary" id="record-${i}">${r.analysis || 'بدون توضیح'}</div>
        <span class="record-toggle" onclick="toggleRecord(${i})" id="toggle-${i}">نمایش جزئیات ▼</span>
      </div>
    `;
  }).join('')}</div>`;
}

function toggleRecord(i) {
  const el = document.getElementById('record-' + i);
  const toggle = document.getElementById('toggle-' + i);
  el.classList.toggle('open');
  toggle.textContent = el.classList.contains('open') ? 'بستن جزئیات ▲' : 'نمایش جزئیات ▼';
}

loadResults();
</script>
</body>
</html>
