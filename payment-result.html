<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — نتیجه پرداخت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#050d1a;color:#e8f4ff;font-family:Vazirmatn,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{max-width:520px;width:100%;background:#0a1628;border:1px solid rgba(0,212,255,.15);border-radius:22px;padding:34px;text-align:center}.icon{font-size:54px}.title{font-size:23px;font-weight:800;margin:14px 0 8px}.text{color:#7aa0c4;line-height:1.9;font-size:13px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.btn{padding:12px;border-radius:12px;text-decoration:none;color:white;background:linear-gradient(135deg,#00d4ff,#0066ff);font-weight:700;font-size:13px}.btn.alt{background:#0f1e36;border:1px solid rgba(0,212,255,.15);color:#7aa0c4}@media(max-width:520px){.btns{grid-template-columns:1fr}}</style></head><body><main class="box"><div class="icon" id="icon">⏳</div><div class="title" id="title">در حال بررسی نتیجه پرداخت</div><div class="text" id="text">نتیجه تراکنش در حال بررسی است.</div><div class="btns"><a class="btn" href="/profile.html">رفتن به پرونده سلامت</a><a class="btn alt" href="/pricing.html">مشاهده پلن‌ها</a></div></main><script>const s=new URLSearchParams(location.search).get('status');const icon=document.getElementById('icon'),title=document.getElementById('title'),text=document.getElementById('text');if(s==='success'){icon.textContent='✅';title.textContent='پرداخت با موفقیت تأیید شد';text.textContent='پلن جدید شما فعال شده و از همین حالا قابل استفاده است.'}else if(s==='pending'){icon.textContent='⏳';title.textContent='پرداخت در حال بررسی است';text.textContent='تراکنش ثبت شده اما تأیید نهایی هنوز تکمیل نشده است. تا زمان تأیید، پرداخت موفق تلقی نمی‌شود.'}else{icon.textContent='❌';title.textContent='پرداخت تکمیل نشد';text.textContent='پرداخت لغو شده یا تأیید نهایی آن ناموفق بوده است. اگر مبلغی کسر شده، وضعیت تراکنش را از پشتیبانی پیگیری کنید.'}</script></body></html>
