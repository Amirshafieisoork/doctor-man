<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — نتیجه پرداخت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#050d1a;color:#e8f4ff;font-family:Vazirmatn,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{max-width:520px;width:100%;background:#0a1628;border:1px solid rgba(0,212,255,.15);border-radius:22px;padding:34px;text-align:center}.icon{font-size:54px}.title{font-size:23px;font-weight:800;margin:14px 0 8px}.text{color:#7aa0c4;line-height:1.9;font-size:13px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.btn{padding:12px;border-radius:12px;text-decoration:none;color:white;background:linear-gradient(135deg,#00d4ff,#0066ff);font-weight:700;font-size:13px}.btn.alt{background:#0f1e36;border:1px solid rgba(0,212,255,.15);color:#7aa0c4}@media(max-width:520px){.btns{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/assets/theme-v1.css"></head><body><main class="box"><div class="icon" id="icon">⏳</div><div class="title" id="title">در حال بررسی نتیجه پرداخت</div><div class="text" id="text">نتیجه تراکنش در حال بررسی است.</div><div class="btns"><a class="btn" href="/profile.html">رفتن به پرونده سلامت</a><a class="btn alt" href="/pricing.html">مشاهده پلن‌ها</a></div></main><script>
const q=new URLSearchParams(location.search),paymentId=q.get('payment_id'),initial=q.get('status');
const icon=document.getElementById('icon'),title=document.getElementById('title'),text=document.getElementById('text');
function paint(status){
 if(status==='paid'||status==='success'){icon.textContent='✅';title.textContent='پرداخت با موفقیت تأیید شد';text.textContent='تأیید نهایی مستقیماً از دیجی‌پی انجام شده و پلن شما فعال است.';return}
 if(status==='failed'||status==='cancelled'){icon.textContent='❌';title.textContent='پرداخت تکمیل نشد';text.textContent='پرداخت تأیید نشده است. بدون Verify سرور هیچ پلنی فعال نمی‌شود.';return}
 icon.textContent='⏳';title.textContent='پرداخت در حال بررسی است';text.textContent='تراکنش هنوز از سمت سرور تأیید نهایی نشده است. لطفاً این صفحه را چند لحظه باز نگه دارید.'
}
async function check(){
 if(!paymentId){paint(initial);return}
 try{
   const r=await fetch('/api/payment-status?payment_id='+encodeURIComponent(paymentId),{credentials:'include'});
   const d=await r.json().catch(()=>({}));
   if(r.status===401){paint('pending');text.textContent='برای مشاهده وضعیت نهایی وارد حسابی شوید که پرداخت را انجام داده است.';return}
   if(!r.ok||!d.success){paint('pending');return}
   paint(d.payment?.status||'pending');
   if(['paid','failed','cancelled'].includes(d.payment?.status))return;
   setTimeout(check,3000);
 }catch{paint('pending');setTimeout(check,5000)}
}
paint(initial);check();
</script></body></html>
