name: DrMan CI

on:
  pull_request:
  push:
    branches: [main, feat/production-ready]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check serverless JavaScript syntax
        run: find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check critical files
        run: test -f health-v3.html && test -f doctors.html && test -f doctor-portal.html && test -f admin-v5.html
