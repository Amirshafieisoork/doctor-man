name: DrMan CI

on:
  pull_request:
  push:
    branches: [main, feat/production-ready]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Check serverless JavaScript syntax
        run: find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check critical files
        run: |
          test -f home-v2.html
          test -f health-v4.html
          test -f doctors.html
          test -f doctor-portal-v2.html
          test -f admin-v7.html
          test -f api/care-plan.js
          test -f api/care-episodes.js
          test -f api/learn-page.js
