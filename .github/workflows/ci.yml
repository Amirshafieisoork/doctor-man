name: DrMan CI

on:
  pull_request:
  push:
    branches: [main, feat/production-ready]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source, links and deployment routes
        run: npm run check
      - name: Test authorization, quotas and payment boundaries
        run: npm test
      - name: Install Chromium for user-flow checks
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop user flows
        run: npm run test:ui
