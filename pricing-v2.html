<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پلن‌ها و اشتراک | دکتر من</title><meta name="description" content="پلن‌های دکتر من برای تفسیر آزمایش، پرونده سلامت و امکانات هوشمند. شروع رایگان و ارتقا در صورت فعال بودن پرداخت."><meta name="robots" content="index,follow"><link rel="canonical" href="https://drman.vercel.app/pricing"><meta property="og:title" content="پلن‌ها و اشتراک | دکتر من"><meta property="og:description" content="از شروع رایگان تا امکانات بیشتر برای پیگیری سلامت و تحلیل آزمایش."><meta property="og:url" content="https://drman.vercel.app/pricing"><meta property="og:type" content="website"><link rel="icon" type="image/png" href="/assets/drman-logo.svg"><link rel="apple-touch-icon" href="/assets/drman-logo.svg"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:55px 55px;pointer-events:none}header{position:sticky;top:0;z-index:10;padding:15px 28px;background:rgba(5,13,26,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--b);display:flex;justify-content:space-between}.brand{color:var(--a);text-decoration:none;font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px}.brand img{width:40px;height:40px;border-radius:11px;object-fit:cover}.back{color:var(--d);text-decoration:none}.hero{text-align:center;padding:70px 20px 40px}.hero h1{font-size:clamp(32px,6vw,52px);margin:0 0 14px}.hero span{color:var(--g)}.hero p{color:var(--d)}.current{max-width:1000px;margin:0 auto 24px;padding:0 20px}.currentBox{background:var(--s);border:1px solid var(--b);border-radius:15px;padding:14px 18px;color:var(--d)}.plans{max-width:1100px;margin:auto;padding:0 20px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{position:relative;background:var(--s);border:1px solid var(--b);border-radius:22px;padding:28px}.card.pop{border-color:var(--y);box-shadow:0 0 28px rgba(255,208,96,.1)}.badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--y);color:#111;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700}.name{font-size:20px;font-weight:800}.price{font-size:34px;font-weight:900;color:var(--a);margin:16px 0 5px}.unit{font-size:12px;color:var(--d);padding-bottom:18px;border-bottom:1px solid var(--b)}ul{list-style:none;padding:0;margin:20px 0;min-height:150px}li{font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}li:before{content:'✓';color:var(--g);margin-left:8px}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,var(--a),#0066ff);color:white;font:700 14px Vazirmatn;cursor:pointer}.btn:disabled{opacity:.45}.pop .btn{background:linear-gradient(135deg,var(--y),#ff8c42);color:#111}.msg{max-width:700px;margin:0 auto 40px;padding:0 20px}.alert{display:none;padding:14px 16px;border-radius:12px;background:var(--s);border:1px solid var(--b);color:var(--d)}.alert.show{display:block}.alert.error{border-color:#ff4466;color:#ff9aae}@media(max-width:800px){.plans{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/assets/theme-v1.css"><link rel="stylesheet" href="/assets/product.css"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/site-style.css"></head><body><header><a class="brand" href="/"><img src="/assets/drman-logo.svg" alt="لوگوی دکتر من">DrMan</a><a class="back" href="/">← بازگشت</a></header><section class="hero"><h1>پلنی متناسب با <span>نیاز شما</span></h1><p>با پلن رایگان شروع کنید و هر زمان به تحلیل و امکانات بیشتری نیاز داشتید ارتقا دهید. پرداخت فقط پس از فعال‌شدن درگاه و تأیید نهایی سرور انجام می‌شود.</p></section><div class="current"><div class="currentBox" id="current">برای مشاهده وضعیت فعلی، وارد حساب شوید.</div></div><div class="msg"><div id="alert" class="alert" role="status" aria-live="polite"></div></div><main class="plans" id="plans" aria-live="polite" aria-busy="true"><div style="color:#7aa0c4">در حال بارگذاری…</div></main><script>
let account = null, paymentsReady = false, purchasing = false;
const alertBox = document.getElementById('alert'), plansBox = document.getElementById('plans');
function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function show(text, error = false) { alertBox.textContent = text; alertBox.className = 'alert show' + (error ? ' error' : ''); }
async function json(url) {
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 20000);
  try { const response = await fetch(url, {credentials:'include', signal:controller.signal}); return {response, data:await response.json().catch(() => null)}; }
  finally { clearTimeout(timer); }
}
async function load() {
  plansBox.setAttribute('aria-busy', 'true'); plansBox.innerHTML = '<div class="muted">در حال دریافت پلن‌ها…</div>';
  try {
    const [plansResult, accountResult, statusResult] = await Promise.allSettled([json('/api/get-plans'), json('/api/account'), json('/api/status')]);
    if (plansResult.status !== 'fulfilled' || !plansResult.value.response.ok || plansResult.value.data?.success !== true || !Array.isArray(plansResult.value.data.plans)) throw new Error('بارگذاری پلن‌ها انجام نشد. دوباره تلاش کنید.');
    paymentsReady = statusResult.status === 'fulfilled' && statusResult.value.response.ok && statusResult.value.data?.payments?.digipay_configured === true;
    account = accountResult.status === 'fulfilled' && accountResult.value.response.ok && accountResult.value.data?.success === true ? accountResult.value.data : null;
    if (account?.subscription) {
      const remaining = account.subscription.remaining == null ? 'نامحدود' : Number(account.subscription.remaining).toLocaleString('fa-IR');
      document.getElementById('current').textContent = `پلن فعلی: ${account.subscription.plan?.name || 'رایگان'} — ${remaining} تحلیل باقی‌مانده این ماه`;
    } else if (accountResult.status === 'rejected' || accountResult.value.response.status !== 401) {
      document.getElementById('current').textContent = 'وضعیت حساب در دسترس نیست. برای بررسی اشتراک به حساب کاربری بروید.';
    }
    render(plansResult.value.data.plans.filter(plan => plan.active !== false));
  } catch (error) {
    plansBox.innerHTML = '<div class="card"><p>پلن‌ها دریافت نشدند.</p><button class="btn" type="button" onclick="load()">تلاش دوباره</button></div>';
    show(error.message || 'ارتباط با سرور برقرار نشد.', true);
  } finally { plansBox.setAttribute('aria-busy', 'false'); }
}
function render(plans) {
  if (!plans.length) { plansBox.innerHTML = '<div class="card">در حال حاضر پلنی برای نمایش ثبت نشده است.</div>'; return; }
  plansBox.innerHTML = plans.map(plan => {
    const price = Number(plan.price || 0), active = account?.subscription?.plan?.id === plan.id;
    const duration = Number(plan.duration_days || 30).toLocaleString('fa-IR');
    const limit = plan.test_limit == null ? 'نامحدود' : Number(plan.test_limit).toLocaleString('fa-IR');
    return `<section class="card ${plan.is_popular ? 'pop' : ''}">${plan.is_popular ? '<div class="badge">پیشنهاد دکتر من</div>' : ''}<div class="name">${esc(plan.name)}</div><div class="price">${price ? price.toLocaleString('fa-IR') : 'رایگان'}</div><div class="unit">${price ? 'تومان / ' + duration + ' روز' : 'شروع بدون هزینه'}</div><ul><li>${limit} تحلیل در ماه</li>${(Array.isArray(plan.features) ? plan.features : []).map(feature => `<li>${esc(feature)}</li>`).join('')}</ul><button class="btn" type="button" data-plan-id="${esc(plan.id)}" data-price="${price}" ${(active || (price > 0 && !paymentsReady)) ? 'disabled' : ''}>${active ? 'پلن فعلی' : price ? (paymentsReady ? 'پرداخت امن' : 'پرداخت به‌زودی فعال می‌شود') : 'شروع رایگان'}</button></section>`;
  }).join('');
}
plansBox.addEventListener('click', event => {
  const button = event.target.closest('button[data-plan-id]');
  if (button && !button.disabled) buy(button.dataset.planId, Number(button.dataset.price), button);
});
async function buy(id, price, button) {
  if (purchasing) return;
  if (!account) { location.assign('/auth?next=/pricing'); return; }
  if (price === 0) { show('حساب شما فعال است؛ می‌توانید از امکانات پلن فعلی در پرونده سلامت استفاده کنید.'); return; }
  if (!paymentsReady) { show('پرداخت آنلاین در حال آماده‌سازی است. پلن رایگان در دسترس است.'); return; }
  purchasing = true; button.disabled = true; show('در حال اتصال به درگاه پرداخت…');
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 25000);
  let navigating = false;
  try {
    const response = await fetch('/api/payment-start', {method:'POST', credentials:'include', signal:controller.signal,
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({plan_id:id})});
    const result = await response.json().catch(() => null);
    if (response.status === 401) { navigating = true; location.assign('/auth?next=/pricing'); return; }
    if (!response.ok || result?.success !== true) throw new Error(result?.error || 'شروع پرداخت انجام نشد.');
    const url = new URL(result.redirect_url);
    if (url.protocol !== 'https:' || url.username || url.password || !/^(?:[^.]+\.)*mydigipay\.(com|info)$/i.test(url.hostname)) throw new Error('آدرس درگاه معتبر دریافت نشد. دوباره تلاش کنید.');
    navigating = true; location.assign(url.href);
  } catch (error) { show(error.name === 'AbortError' ? 'پاسخ درگاه طول کشید. دوباره تلاش کنید.' : error.message || 'ارتباط با درگاه برقرار نشد.', true); }
  finally { clearTimeout(timer); if (!navigating) { purchasing = false; button.disabled = false; } }
}
load();
</script></body></html>
