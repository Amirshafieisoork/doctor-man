<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrMan — پلن‌ها</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--bg:#050d1a;--s:#0a1628;--s2:#0f1e36;--a:#00d4ff;--g:#00ff9d;--y:#ffd060;--t:#e8f4ff;--d:#7aa0c4;--b:rgba(0,212,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,sans-serif}body:before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:55px 55px;pointer-events:none}header{position:sticky;top:0;z-index:10;padding:15px 28px;background:rgba(5,13,26,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--b);display:flex;justify-content:space-between}.brand{color:var(--a);text-decoration:none;font-weight:900;font-size:20px}.back{color:var(--d);text-decoration:none}.hero{text-align:center;padding:70px 20px 40px}.hero h1{font-size:clamp(32px,6vw,52px);margin:0 0 14px}.hero span{color:var(--g)}.hero p{color:var(--d)}.current{max-width:1000px;margin:0 auto 24px;padding:0 20px}.currentBox{background:var(--s);border:1px solid var(--b);border-radius:15px;padding:14px 18px;color:var(--d)}.plans{max-width:1100px;margin:auto;padding:0 20px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{position:relative;background:var(--s);border:1px solid var(--b);border-radius:22px;padding:28px}.card.pop{border-color:var(--y);box-shadow:0 0 28px rgba(255,208,96,.1)}.badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--y);color:#111;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700}.name{font-size:20px;font-weight:800}.price{font-size:34px;font-weight:900;color:var(--a);margin:16px 0 5px}.unit{font-size:12px;color:var(--d);padding-bottom:18px;border-bottom:1px solid var(--b)}ul{list-style:none;padding:0;margin:20px 0;min-height:150px}li{font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}li:before{content:'✓';color:var(--g);margin-left:8px}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,var(--a),#0066ff);color:white;font:700 14px Vazirmatn;cursor:pointer}.btn:disabled{opacity:.45}.pop .btn{background:linear-gradient(135deg,var(--y),#ff8c42);color:#111}.msg{max-width:700px;margin:0 auto 40px;padding:0 20px}.alert{display:none;padding:14px 16px;border-radius:12px;background:var(--s);border:1px solid var(--b);color:var(--d)}.alert.show{display:block}.alert.error{border-color:#ff4466;color:#ff9aae}@media(max-width:800px){.plans{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="/">🩺 DrMan</a><a class="back" href="/">← بازگشت</a></header><section class="hero"><h1>پلن مناسب <span>سلامت شما</span></h1><p>از شروع رایگان تا استفاده حرفه‌ای؛ بدون هزینه پنهان.</p></section><div class="current"><div class="currentBox" id="current">برای مشاهده وضعیت فعلی، وارد حساب شوید.</div></div><div class="msg"><div id="alert" class="alert"></div></div><main class="plans" id="plans"><div style="color:#7aa0c4">در حال بارگذاری…</div></main><script>let account=null;const alertBox=document.getElementById('alert');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(t,e=false){alertBox.textContent=t;alertBox.className='alert show'+(e?' error':'')}async function load(){const [p,a]=await Promise.all([fetch('/api/get-plans').then(r=>r.json()),fetch('/api/account').then(async r=>({status:r.status,data:await r.json().catch(()=>({}))}))]);account=a.status===200?a.data:null;if(account){document.getElementById('current').textContent=`پلن فعلی: ${account.subscription.plan?.name||'رایگان'} — ${account.subscription.remaining==null?'نامحدود':account.subscription.remaining.toLocaleString('fa-IR')} تحلیل باقی‌مانده این ماه`;}render((p.plans||[]).filter(x=>x.active!==false))}function render(plans){document.getElementById('plans').innerHTML=plans.map(p=>{const price=Number(p.price||0),active=account?.subscription?.plan?.id===p.id;return `<section class="card ${p.is_popular?'pop':''}">${p.is_popular?'<div class="badge">محبوب‌ترین</div>':''}<div class="name">${esc(p.name)}</div><div class="price">${price?price.toLocaleString('fa-IR'):'رایگان'}</div><div class="unit">${price?'تومان / ۳۰ روز':'شروع بدون هزینه'}</div><ul><li>${Number(p.test_limit).toLocaleString('fa-IR')} تحلیل در ماه</li>${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul><button class="btn" ${active?'disabled':''} onclick="buy('${p.id}',${price})">${active?'پلن فعلی':price?'پرداخت با دیجی‌پی':'شروع رایگان'}</button></section>`}).join('')}async function buy(id,price){if(!account){location.href='/auth.html';return}if(price===0){show('حساب شما از ابتدا روی پلن رایگان فعال است.');return}show('در حال اتصال به دیجی‌پی…');try{const r=await fetch('/api/payment-start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'شروع پرداخت انجام نشد');location.href=d.redirect_url}catch(e){show(e.message,true)}}load().catch(()=>show('بارگذاری پلن‌ها انجام نشد.',true));</script></body></html>
